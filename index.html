    const normalizar = (str) => String(str || '')

      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, ' ')
      .trim();

    const PALAVRAS_MINUSCULAS = ['de', 'da', 'do', 'das', 'dos', 'e'];
    const toTitleCase = (str) => String(str || '').toLowerCase().split(' ')
      .map((w, i) => (i > 0 && PALAVRAS_MINUSCULAS.includes(w)) ? w : w.charAt(0).toUpperCase() + w.slice(1))
      .join(' ');

    // Converte o nome do município vindo da planilha para o nome padronizado do site
    const nomeMunicipioPadrao = (bruto) => {

      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

    // Prepara o conteúdo das notícias: aceita texto simples (com parágrafos) ou HTML,
    // e sempre passa pelo DOMPurify para remover qualquer código malicioso.
    const prepararConteudo = (texto) => {
      if (!texto) return '';
      const temHtml = /<[a-z][\s\S]*>/i.test(texto);
      const temBlocos = /<(p|br|div|ul|ol|h[1-6]|table)\b/i.test(texto);
      const html = temHtml
        ? (temBlocos ? texto : texto.split(/\n{2,}/).map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join(''))
        : texto.split(/\n{2,}/).map(p => `<p>${escapeHtml(p).replace(/\n/g, '<br>')}</p>`).join('');
      if (window.DOMPurify) return window.DOMPurify.sanitize(html, { ADD_ATTR: ['target'] });
      return `<p>${escapeHtml(texto).replace(/\n/g, '<br>')}</p>`;
    };

    // Converte link de compartilhamento do Google Drive em link de imagem que carrega no site
    const linkImagemDrive = (id, largura = 1600) => `https://drive.google.com/thumbnail?id=${id}&sz=w${largura}`;
    const converterLinkDrive = (url) => {
      if (!url) return '';
      const str = String(url).trim();
      const padroes = [
        /drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/,
        /drive\.google\.com\/open\?id=([a-zA-Z0-9_-]+)/,
        /google\.com\/uc\?[^"]*id=([a-zA-Z0-9_-]+)/,
        /drive\.google\.com\/thumbnail\?id=([a-zA-Z0-9_-]+)/
      ];
      for (const p of padroes) {
        const m = str.match(p);
        if (m && m[1]) return linkImagemDrive(m[1]);
      }
      // Força https para não gerar o aviso "Não seguro" no navegador
      return str.replace(/^http:\/\//i, 'https://');
    };

    // ---- Datas ----
    const criarData = (y, m, d) => {
      if (!y || m < 1 || m > 12 || d < 1 || d > 31) return null;
      const dt = new Date(y, m - 1, d);
      return dt.getMonth() === m - 1 ? dt : null;
    };
    const excelSerialToDate = (serial) => {
      const dt = new Date(Math.round((serial - 25569) * 86400 * 1000));
      return new Date(dt.getUTCFullYear(), dt.getUTCMonth(), dt.getUTCDate());
    };
    // Descobre se uma coluna de datas está em DD/MM/AAAA (padrão BR) ou MM/DD/AAAA (padrão EUA),
    // olhando todos os valores da coluna. Na dúvida, assume o padrão brasileiro.
    const detectarOrdemDatas = (valores) => {
      let dmy = 0, mdy = 0;
      valores.forEach(v => {
        const m = String(v || '').trim().match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-]\d{2,4}/);
        if (!m) return;
        if (+m[1] > 12) dmy++;
        else if (+m[2] > 12) mdy++;
      });
      return mdy > dmy ? 'MDY' : 'DMY';
    };
    const parseData = (valor, ordem = 'DMY') => {
      if (valor === null || valor === undefined || valor === '') return null;
      if (typeof valor === 'number') return excelSerialToDate(valor);
      const s = String(valor).trim();
      if (!s) return null;
      let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (m) return criarData(+m[1], +m[2], +m[3]);
      m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);
      if (m) {
        let a = +m[1], b = +m[2], y = +m[3];
        if (y < 100) y += 2000;
        let dia, mes;
        if (a > 12) { dia = a; mes = b; }
        else if (b > 12) { dia = b; mes = a; }
        else if (ordem === 'MDY') { mes = a; dia = b; }
        else { dia = a; mes = b; }
        return criarData(y, mes, dia);
      }
      return null;
    };
    const formatarDataBR = (dt) => dt
      ? `${String(dt.getDate()).padStart(2, '0')}/${String(dt.getMonth() + 1).padStart(2, '0')}/${dt.getFullYear()}`
      : '';
    const paraISO = (dt) => dt
      ? `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`
      : '';
    // Exibe AAAA-MM-DD como DD/MM/AAAA sem erro de fuso horário
    const isoParaBR = (iso) => {
      const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
      return m ? `${m[3]}/${m[2]}/${m[1]}` : (iso || '');
    };

    const situacaoPorData = (dt) => {
      if (!dt) return 'Sem data';
      const hoje = new Date();
      hoje.setHours(0, 0, 0, 0);
      return dt < hoje ? 'Encerrado' : 'Aberto';
    };

    // ---- Valores monetários ----
    const formatarMoeda = (valor) => {
      if (valor === null || valor === undefined || valor === '') return '';
      if (typeof valor === 'number') {
        return isNaN(valor) ? '' : valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
      }
      const s = String(valor).trim();
      if (!s) return '';
      if (s.toUpperCase().includes('R$')) return s;
      if (/^-?\d+([.,]\d+)?$/.test(s)) {
        const n = parseFloat(s.replace(',', '.'));
        if (!isNaN(n)) return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
      }
      return s;
    };
    const moedaParaNumero = (valor) => {
      if (valor === null || valor === undefined || valor === '') return 0;
      if (typeof valor === 'number') return valor;
      const limpo = String(valor).replace(/[^\d,.-]/g, '').replace(/\./g, '').replace(',', '.');
      const n = parseFloat(limpo);
      return isNaN(n) ? 0 : n;
    };

    // ---- Leitura das planilhas ----
    const baixarCSV = (url) => new Promise((resolve, reject) => {
      Papa.parse(url, {
        download: true,
        header: false,
        skipEmptyLines: false,
        complete: (r) => resolve(r.data || []),
        error: (err) => reject(err)
      });
    });
    // Converte o link publicado (pubhtml) em link de CSV
    const urlCSVPublicado = (url) => {
      const u = String(url || '').trim();
      if (!u) return '';
      if (/output=csv/.test(u)) return u;
      const base = u.replace('/pubhtml', '/pub').replace(/[?#].*$/, '');
      const gid = (u.match(/[?&]gid=(\d+)/) || [])[1] || '0';
      return `${base}?gid=${gid}&single=true&output=csv`;
    };
    const lerPlanilhaPublicada = async (url, validar) => {
      const csv = urlCSVPublicado(url);
      // Parâmetro extra evita que o navegador mostre uma cópia antiga em cache
      const comCache = csv + `&t=${Math.floor(Date.now() / 60000)}`;
      for (const tentativa of [comCache, csv]) {
        try {
          const linhas = await baixarCSV(tentativa);
          if (validar(linhas)) return linhas;
        } catch (e) {
          console.warn('[Observatório PNAE] Falha ao ler a planilha publicada', e);
        }
      }
      return null;
    };

    // ---- Editais ----
    const encontrarCabecalhoEditais = (linhas) => {
      for (let i = 0; i < Math.min(10, linhas.length); i++) {
        const norm = (linhas[i] || []).map(normalizar);
        if (norm.some(c => c.includes('municipio')) && norm.some(c => c.includes('edital') && !c.includes('valor'))) return i;
      }
      return -1;
    };
    const mapearColunasEditais = (cab) => {
      const n = (cab || []).map(normalizar);
      const idx = (f) => n.findIndex(f);
      return {
        municipio: idx(h => h.includes('municipio')),
        escola: idx(h => h.includes('escola')),
        numeroEdital: idx(h => h.includes('edital') && !h.includes('valor') && !ehColunaLink(h)),
        linkEdital: idx(h => ehColunaLink(h)),
        dataLancamento: idx(h => h.includes('lancamento')),
        dataFechamento: idx(h => h.includes('fechamento')),
        vigencia: idx(h => h.includes('vigencia')),
        valorEdital: idx(h => h.includes('valor') && h.includes('edital')),
        contemplados: idx(h => h.includes('contempl')),
        numeroContrato: idx(h => h.includes('contrato') && !h.includes('valor') && !ehColunaLink(h)),
        valorContrato: idx(h => h.includes('valor') && h.includes('contrato')),
        familiasBeneficiadas: idx(h => h.includes('familia')),
        alunosBeneficiados: idx(h => h.includes('aluno'))
      };
    };
    // Coluna com o link do edital completo (ex.: "LINK DO EDITAL", "URL", "EDITAL COMPLETO")
    const ehColunaLink = (h) => h.includes('link') || h.includes('url') || h.includes('completo');
    const normalizarLink = (bruto) => {
      const s = String(bruto || '').trim();
      if (/^https?:\/\//i.test(s)) return s.replace(/^http:\/\//i, 'https://');
      if (/^(www\.|drive\.|docs\.)/i.test(s)) return 'https://' + s;
      return '';
    };
    const IGNORAR_MUNICIPIO = ['estado da bahia', 'total', 'municipios'];
    const processarEditais = (linhas) => {
      const iCab = encontrarCabecalhoEditais(linhas);
      if (iCab === -1) return [];
      const col = mapearColunasEditais(linhas[iCab]);
      const dados = linhas.slice(iCab + 1);
      const ordemLanc = col.dataLancamento >= 0 ? detectarOrdemDatas(dados.map(r => r[col.dataLancamento])) : 'DMY';
      const ordemFech = col.dataFechamento >= 0 ? detectarOrdemDatas(dados.map(r => r[col.dataFechamento])) : 'DMY';
      const lista = [];
      dados.forEach((row, i) => {
        const get = (k) => (col[k] >= 0 ? String(row[col[k]] ?? '').trim() : '');
        const municipioBruto = get('municipio');
        const numero = get('numeroEdital');
        if (!municipioBruto || !numero) return;
        if (IGNORAR_MUNICIPIO.includes(normalizar(municipioBruto))) return;
        const dtLanc = col.dataLancamento >= 0 ? parseData(row[col.dataLancamento], ordemLanc) : null;
        const dtFech = col.dataFechamento >= 0 ? parseData(row[col.dataFechamento], ordemFech) : null;
        const valorEdital = formatarMoeda(get('valorEdital'));
        const valorContrato = formatarMoeda(get('valorContrato'));
        const ano = (numero.match(/(\d{4})/) || [])[1] || (dtFech ? String(dtFech.getFullYear()) : '');
        lista.push({
          id: `edital-${iCab + 1 + i}`,
          municipio: nomeMunicipioPadrao(municipioBruto),
          escola: get('escola'),
          numero: /chamada/i.test(numero) ? numero : `Chamada Pública nº ${numero}`,
          dataLancamento: formatarDataBR(dtLanc),
          data: formatarDataBR(dtFech) || 'Não informada',
          dataFechamentoObj: dtFech,
          vigencia: get('vigencia') || '—',
          valorEdital,
          contemplados: get('contemplados'),
          numeroContrato: get('numeroContrato'),
          valorContrato: valorContrato || valorEdital || 'A definir',
          familiasBeneficiadas: get('familiasBeneficiadas'),
          alunosBeneficiados: get('alunosBeneficiados'),
          situacao: situacaoPorData(dtFech),
          linkEdital: normalizarLink(get('linkEdital')),
          ano
        });
      });
      // Mais recentes primeiro
      return lista.sort((a, b) => (b.dataFechamentoObj?.getTime() || 0) - (a.dataFechamentoObj?.getTime() || 0));
    };

    // ---- Notícias ----
    const encontrarCabecalhoNoticias = (linhas) => {
      for (let i = 0; i < Math.min(10, linhas.length); i++) {
        if ((linhas[i] || []).map(normalizar).some(c => c.includes('titulo') && !c.includes('sub'))) return i;
      }
      return -1;
    };
    const mapearColunasNoticias = (cab) => {
      const n = (cab || []).map(normalizar);
      const idx = (f) => n.findIndex(f);
      return {
        titulo: idx(h => h.includes('titulo') && !h.includes('sub')),
        subtitulo: idx(h => h.includes('subtitulo')),
        resumo: idx(h => h.includes('resumo')),
        conteudo: idx(h => h.includes('conteudo')),
        categoria: idx(h => h.includes('categoria') || h.includes('assunto')),
        municipio: idx(h => h.includes('municipio')),
        autor: idx(h => h.includes('autor')),
        data: idx(h => h.includes('data')),
        status: idx(h => h.includes('status')),
        imagem: idx(h => h.includes('imagem') && !h.includes('galeria')),
        galeria: idx(h => h.includes('galeria'))
      };
    };
    const processarNoticias = (linhas) => {
      const iCab = encontrarCabecalhoNoticias(linhas);
      if (iCab === -1) return [];
      const col = mapearColunasNoticias(linhas[iCab]);
      const dados = linhas.slice(iCab + 1);
      const ordem = col.data >= 0 ? detectarOrdemDatas(dados.map(r => r[col.data])) : 'DMY';
      const lista = [];
      dados.forEach((row, i) => {
        const get = (k) => (col[k] >= 0 ? String(row[col[k]] ?? '').trim() : '');
        const titulo = get('titulo');
        if (!titulo) return;
        const status = normalizar(get('status'));
        if (status === 'rascunho' || status === 'despublicada' || status === 'oculta') return;
        const dt = col.data >= 0 ? parseData(row[col.data], ordem) : null;
        const galeria = get('galeria')
          ? get('galeria').split(/[,\n]/).map(s => converterLinkDrive(s.trim())).filter(Boolean)
          : [];
        lista.push({
          id: `noticia-${iCab + 1 + i}`,
          titulo,
          subtitulo: get('subtitulo'),
          resumo: get('resumo'),
          conteudo: get('conteudo'),
          categoria: get('categoria') || 'Notícia',
          municipio: get('municipio') || 'Regional / Baixo Sul',
          autor: get('autor') || 'Comunicação CIAPRA',
          data: paraISO(dt),
          imagem: converterLinkDrive(get('imagem')),
          galeria
        });
      });
      return lista.sort((a, b) => (b.data || '').localeCompare(a.data || ''));
    };

    const formatarTamanho = (bytes) => {
      const b = parseInt(bytes, 10);
      if (!b || isNaN(b)) return '';
      if (b < 1024) return `${b} B`;
      if (b < 1024 * 1024) return `${(b / 1024).toFixed(0)} KB`;
      return `${(b / (1024 * 1024)).toFixed(1)} MB`;
    };
    const iconeArquivo = (mime) => {
      if (!mime) return '📄';
      if (mime.includes('pdf')) return '📕';
      if (mime.includes('spreadsheet')) return '📊';
      if (mime.includes('document')) return '📘';
      if (mime.includes('presentation')) return '📙';
      if (mime.includes('image')) return '🖼️';
      if (mime.includes('folder')) return '📁';
      return '📄';
    };

    // Imagem com troca automática para um marcador visual caso o link quebre
    function Img({ src, alt, className, fallback = PLACEHOLDER_IMG, ...rest }) {
      const [erro, setErro] = useState(false);
      useEffect(() => setErro(false), [src]);
      return (
        <img
          src={!src || erro ? fallback : src}
          alt={alt}
          className={className}
          loading="lazy"
          onError={() => setErro(true)}
          {...rest}
        />
      );
    }

    function EstadoVazio({ status, vazio, erro }) { return (
      <div className="col-span-full text-center py-12 text-brand-charcoal/60 text-sm">
        {status === 'carregando' && (
          <span className="inline-flex items-center gap-2">
            <span className="w-2 h-2 rounded-full bg-brand-yellow animate-pulse inline-block"></span>
            Carregando dados...
          </span>
        )}
        {status === 'erro' && <span>{erro}</span>}
        {status === 'ok' && <span>{vazio}</span>}
      </div>
    ); }

    function CardNoticia({ item, onOpen }) { return (
      <div className="bg-white rounded-2xl overflow-hidden border border-brand-light/60 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 flex flex-col h-full">
        <div className="h-44 relative overflow-hidden shrink-0">
          <Img src={item.imagem} alt={item.titulo} className="w-full h-full object-cover" />
          <span className="absolute top-3 left-3 bg-brand-primary text-brand-yellow font-extrabold text-[10px] px-2.5 py-1 rounded-full uppercase tracking-wider shadow">
            {item.categoria}
          </span>
        </div>
        <div className="p-5 flex-grow flex flex-col justify-between">
          <div className="space-y-2">
            <div className="flex items-center justify-between gap-2">
              <span className="text-[10px] text-brand-charcoal/50 font-bold">{isoParaBR(item.data)}</span>
              <span className="text-[10px] text-brand-green font-bold truncate">📍 {item.municipio}</span>
            </div>
            <h3 className="text-base font-extrabold text-brand-brown leading-snug line-clamp-2">{item.titulo}</h3>
            <p className="text-xs text-brand-charcoal/75 leading-relaxed line-clamp-3">{item.resumo}</p>
          </div>
          <div className="pt-4 mt-4 border-t border-brand-light/50">
            <button
              onClick={() => onOpen(item)}
              className="w-full py-2 bg-brand-cream hover:bg-brand-brown hover:text-white text-brand-brown font-extrabold rounded-xl text-xs tracking-wider transition-all duration-300 shadow-sm"
            >
              Leia mais →
            </button>
          </div>
        </div>
      </div>
    ); }

    // ---- Visualização de dados ----
    const moedaCompacta = (v) => {
      if (!v && v !== 0) return '';
      if (Math.abs(v) >= 1e6) return `R$ ${(v / 1e6).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 })} mi`;
      if (Math.abs(v) >= 1e4) return `R$ ${Math.round(v / 1e3).toLocaleString('pt-BR')} mil`;
      return `R$ ${Math.round(v).toLocaleString('pt-BR')}`;
    };

    const ICONE_EDITAL = (<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" className="w-4 h-4 shrink-0" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6"/><path d="M9 17h4"/></svg>);

    // Botão do edital completo: sempre aparece. Sem link na planilha, fica desativado.
    function LinkEdital({ href, compacto }) {
      if (!href) {
        return (
          <span
            title="O link do edital completo ainda não foi cadastrado na planilha"
            aria-label="Edital completo indisponível"
            className={compacto
              ? 'inline-flex items-center gap-1.5 h-9 px-3 rounded-lg border border-dashed border-brand-light text-brand-charcoal/35 text-xs font-extrabold cursor-not-allowed whitespace-nowrap select-none'
              : 'inline-flex items-center gap-1.5 px-4 py-2 rounded-lg border border-dashed border-brand-light text-brand-charcoal/40 text-xs font-extrabold cursor-not-allowed select-none'}
          >
            {ICONE_EDITAL}{compacto ? 'Edital' : 'Edital em breve'}
          </span>
        );
      }
      return (
        <a
          href={href}
          target="_blank"
          rel="noopener noreferrer"
          onClick={(e) => e.stopPropagation()}
          title="Abrir o edital completo em nova aba"
          aria-label="Abrir o edital completo em nova aba"
          className={compacto
            ? 'inline-flex items-center gap-1.5 h-9 px-3 rounded-lg border border-brand-green/50 text-brand-darkGreen hover:bg-brand-green/10 text-xs font-extrabold transition-colors whitespace-nowrap'
            : 'inline-flex items-center gap-1.5 px-4 py-2 rounded-lg bg-brand-green text-white hover:bg-brand-darkGreen text-xs font-extrabold transition-colors shadow-sm'}
        >
          {ICONE_EDITAL}{compacto ? 'Edital' : 'Edital completo'}
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>
        </a>
      );
    }

    // Separa "NOME: R$ 1.000,00 NOME 2: R$ 2.000,00" em uma lista organizada
    const separarContemplados = (texto) => {
      const t = String(texto || '').trim();
      if (!t) return [];
      const itens = [...t.matchAll(/([^:;\n]+?)\s*:\s*(R\$\s*[\d.,]+)/g)].map(m => ({ nome: m[1].replace(/^[\s,;\-–]+/, '').trim(), valor: m[2].replace(/\s+/g, ' ') }));
      return itens.length ? itens : [{ nome: t, valor: '' }];
    };

    function IndicadorTile({ cor, icone, rotulo, valor, nota }) {
      return (
        <div className="bg-white rounded-2xl border border-brand-light shadow-sm hover:shadow-md transition-shadow p-5 flex gap-4 items-start relative overflow-hidden">
          <span className="absolute left-0 top-0 bottom-0 w-1.5" style={{ backgroundColor: cor }} aria-hidden="true"></span>
          <span className="w-11 h-11 rounded-xl flex items-center justify-center text-xl shrink-0" style={{ backgroundColor: cor + '1A' }} aria-hidden="true">{icone}</span>
          <div className="min-w-0">
            <span className="block text-xs font-bold text-brand-charcoal/70">{rotulo}</span>
            <span className="block text-3xl font-black text-brand-brown leading-tight mt-1 whitespace-nowrap">{valor}</span>
            <span className="block text-[11px] text-brand-charcoal/55 mt-1 leading-snug">{nota}</span>
          </div>
        </div>
      );
    }

    const METRICAS_COMPARATIVO = [
      { key: 'valorContratado', rotulo: 'Repasse PNAE 2025', valor: (m) => m.valorContratado, fmt: (v) => moedaCompacta(v), fonte: 'FNDE, consulta de liberações do PNAE — total pago em 2025' },
      { key: 'porAluno', rotulo: 'Repasse por aluno', valor: (m) => m.valorContratado / m.alunosRedeMunicipal, fmt: (v) => moedaCompacta(v), fonte: 'Repasse FNDE 2025 ÷ matrículas da rede municipal (Inep 2025)' },
      { key: 'alunosRedeMunicipal', rotulo: 'Alunos', valor: (m) => m.alunosRedeMunicipal, fmt: (v) => v.toLocaleString('pt-BR'), fonte: 'Inep, Sinopse Estatística da Educação Básica 2025' },
      { key: 'agricultores', rotulo: 'Agricultores (CAF)', valor: (m) => m.agricultores, fmt: (v) => v.toLocaleString('pt-BR'), fonte: 'Cadastro Nacional da Agricultura Familiar (CAF/MDA), número informado pelo CIAPRA — o MDA não publica esse dado por município' }
    ];

    function ComparativoMunicipios({ onSelect }) {
      const [metricaKey, setMetricaKey] = useState('valorContratado');
      const [hover, setHover] = useState(null);
      const [verTabela, setVerTabela] = useState(false);
      const metrica = METRICAS_COMPARATIVO.find(x => x.key === metricaKey);
      const linhas = useMemo(() => MUNICIPIOS
        .map(m => ({ m, v: metrica.valor(m) }))
        .sort((a, b) => b.v - a.v), [metricaKey]);
      const max = Math.max(metrica.escalaMin || 0, ...linhas.map(l => l.v));
      const pct = (v) => `${Math.max(0, (v / max) * 100)}%`;

      return (
        <div className="bg-white rounded-2xl border border-brand-light shadow-sm p-5 sm:p-7">
          <div className="flex flex-col md:flex-row md:items-end md:justify-between gap-4 mb-5">
            <div>
              <h2 className="text-xl font-black text-brand-brown tracking-tight">Comparativo entre municípios</h2>
              <p className="text-sm text-brand-charcoal/70 mt-1">{metrica.rotulo}, do maior para o menor. Passe o mouse para ver todos os dados; clique para abrir a ficha.</p>
            </div>
            <button onClick={() => setVerTabela(!verTabela)} className="self-start md:self-auto text-xs font-bold text-brand-primary border border-brand-light rounded-lg px-3 py-2 hover:bg-brand-cream">
              {verTabela ? '📊 Ver gráfico' : '📋 Ver tabela'}
            </button>
          </div>

          <div className="flex flex-wrap gap-2 mb-6" role="tablist" aria-label="Escolha o indicador">
            {METRICAS_COMPARATIVO.map(x => (
              <button
                key={x.key}
                role="tab"
                aria-selected={x.key === metricaKey}
                onClick={() => setMetricaKey(x.key)}
                className={`text-xs font-bold px-3 py-2 rounded-full border transition-colors ${x.key === metricaKey ? 'bg-brand-brown text-white border-brand-brown' : 'bg-white text-brand-charcoal border-brand-light hover:border-brand-brown/40'}`}
              >
                {x.rotulo}
              </button>
            ))}
          </div>

          {verTabela ? (
            <div className="overflow-x-auto">
              <table className="w-full text-sm text-left">
                <thead>
                  <tr className="text-[11px] uppercase tracking-wide text-brand-charcoal/60 border-b border-brand-light">
                    <th className="py-2 pr-3">Município</th>
                    {METRICAS_COMPARATIVO.map(x => <th key={x.key} className="py-2 px-3 text-right">{x.rotulo}</th>)}
                  </tr>
                </thead>
                <tbody>
                  {linhas.map(({ m }) => (
                    <tr key={m.id} className="border-b border-brand-light/60 hover:bg-brand-cream cursor-pointer" onClick={() => onSelect(m)}>
                      <td className="py-2 pr-3 font-bold text-brand-brown">{m.nome}</td>
                      {METRICAS_COMPARATIVO.map(x => <td key={x.key} className="py-2 px-3 text-right tabular-nums text-brand-charcoal">{x.fmt(x.valor(m), m)}</td>)}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          ) : (
            <div className="space-y-0.5" role="list">
              {metrica.referencias && (
                <div className="grid grid-cols-[7.5rem_1fr_4.5rem] sm:grid-cols-[10rem_1fr_5.5rem] gap-3 h-5 text-[10px] font-bold text-brand-charcoal/60">
                  <span></span>
                  <div className="relative">
                    {metrica.referencias.map(r => (
                      <span key={r} className="absolute -translate-x-1/2 bottom-0" style={{ left: pct(r) }}>mín. {r}%</span>
                    ))}
                  </div>
                  <span></span>
                </div>
              )}
              {linhas.map(({ m, v }) => {
                const ativo = hover === m.id;
                return (
                  <button
                    key={m.id}
                    role="listitem"
                    onClick={() => onSelect(m)}
                    onMouseEnter={() => setHover(m.id)}
                    onMouseLeave={() => setHover(null)}
                    onFocus={() => setHover(m.id)}
                    onBlur={() => setHover(null)}
                    aria-label={`${m.nome}: ${metrica.fmt(v, m)}`}
                    className="relative w-full grid grid-cols-[7.5rem_1fr_4.5rem] sm:grid-cols-[10rem_1fr_5.5rem] gap-3 items-center py-1.5 rounded-lg hover:bg-brand-cream focus:outline-none focus:ring-2 focus:ring-brand-yellow text-left"
                  >
                    <span className={`text-xs truncate ${ativo ? 'font-black text-brand-brown' : 'font-semibold text-brand-charcoal'}`}>{m.nome}</span>
                    <span className="relative h-4 border-l border-brand-charcoal/30">
                      {(metrica.referencias || []).map(r => (
                        <span key={r} className="absolute top-[-6px] bottom-[-6px] border-l border-dashed border-brand-charcoal/50" style={{ left: pct(r) }} aria-hidden="true"></span>
                      ))}
                      <span
                        className="absolute left-0 top-0 h-full rounded-r-[4px] transition-all duration-500"
                        style={{ width: pct(v), backgroundColor: ativo ? '#52291D' : '#327025' }}
                      ></span>
                      {ativo && (
                        <span className="hidden sm:block absolute z-30 top-1/2 -translate-y-1/2 bg-brand-charcoal text-white rounded-xl shadow-xl p-3 w-60 pointer-events-none text-left" role="tooltip" style={(v / max) > 0.55 ? { right: `calc(${100 - (v / max) * 100}% + 10px)` } : { left: `calc(${pct(v)} + 10px)` }}>
                          <span className="block text-sm font-black text-brand-yellow mb-1">{m.nome}</span>
                          {METRICAS_COMPARATIVO.map(x => (
                            <span key={x.key} className={`flex justify-between gap-3 text-[11px] ${x.key === metricaKey ? 'font-black' : 'text-white/80'}`}>
                              <span>{x.rotulo}</span><span className="tabular-nums">{x.fmt(x.valor(m), m)}</span>
                            </span>
                          ))}
                        </span>
                      )}
                    </span>
                    <span className="text-xs font-bold text-brand-charcoal text-right tabular-nums">{metrica.fmt(v, m)}</span>

                  </button>
                );
              })}
            </div>
          )}
          <p className="text-[10px] text-brand-charcoal/55 mt-4">Fonte: {metrica.fonte}.</p>
        </div>
      );
    }

    // =====================================================================================
    // BIBLIOTECA (lê a pasta do Google Drive e todas as subpastas)
    // =====================================================================================
    const GOOGLE_EXPORT = {
      'application/vnd.google-apps.document': (id) => `https://docs.google.com/document/d/${id}/export?format=pdf`,
      'application/vnd.google-apps.spreadsheet': (id) => `https://docs.google.com/spreadsheets/d/${id}/export?format=xlsx`,
      'application/vnd.google-apps.presentation': (id) => `https://docs.google.com/presentation/d/${id}/export/pdf`
    };
    const linkDownload = (f) => GOOGLE_EXPORT[f.mimeType] ? GOOGLE_EXPORT[f.mimeType](f.id) : `https://drive.google.com/uc?export=download&id=${f.id}`;
    const tipoArquivo = (f) => {
      const m = f.mimeType || '';
      const ext = (f.name.match(/\.([a-z0-9]{2,5})$/i) || [])[1];
      if (m.includes('pdf') || ext === 'pdf') return { rotulo: 'PDF', cor: '#B42318', fundo: '#FEE4E2' };
      if (m.includes('spreadsheet') || m.includes('excel') || /xlsx?|csv/i.test(ext || '')) return { rotulo: 'Planilha', cor: '#327025', fundo: '#E3F1DF' };
      if (m.includes('presentation') || m.includes('powerpoint') || /pptx?/i.test(ext || '')) return { rotulo: 'Apresentação', cor: '#B54708', fundo: '#FEF0C7' };
      if (m.includes('document') || m.includes('word') || /docx?/i.test(ext || '')) return { rotulo: 'Documento', cor: '#1D4ED8', fundo: '#DBEAFE' };
      if (m.includes('image')) return { rotulo: 'Imagem', cor: '#6941C6', fundo: '#EDE9FE' };
      if (m.includes('video')) return { rotulo: 'Vídeo', cor: '#4B4D4F', fundo: '#E6E6E6' };
      return { rotulo: (ext || 'Arquivo').toUpperCase(), cor: '#4B4D4F', fundo: '#E6E6E6' };
    };
    const nomeSemExtensao = (n) => n.replace(/\.[a-z0-9]{2,5}$/i, '').replace(/[_]+/g, ' ');
    const capitalizar = (t) => {
      const s = String(t || '').trim();
      return s === s.toUpperCase() ? s.charAt(0) + s.slice(1).toLowerCase() : s;
    };
    const ICONE_CATEGORIA = (nome) => {
      const n = normalizar(nome);
      if (n.includes('lei') || n.includes('legisl') || n.includes('resolu') || n.includes('decreto')) return '⚖️';
      if (n.includes('cartilha') || n.includes('guia') || n.includes('manual')) return '📘';
      if (n.includes('book') || n.includes('livro')) return '📖';
      if (n.includes('nota')) return '📝';
      if (n.includes('modelo') || n.includes('formul')) return '🗂️';
      if (n.includes('apresenta') || n.includes('slide')) return '📊';
      if (n.includes('video')) return '🎬';
      return '📁';
    };

    async function listarPasta(folderId) {
      const arquivos = [];
      let pageToken = '';
      do {
        const params = new URLSearchParams({
          q: `'${folderId}' in parents and trashed = false`,
          key: CONFIG.DRIVE_API_KEY,
          fields: 'nextPageToken,files(id,name,mimeType,size,modifiedTime)',
          orderBy: 'folder,name',
          pageSize: '1000',
          includeItemsFromAllDrives: 'true',
          supportsAllDrives: 'true'
        });
        if (pageToken) params.set('pageToken', pageToken);
        const res = await fetch(`https://www.googleapis.com/drive/v3/files?${params.toString()}`);
        const data = await res.json();
        if (!data.files) throw new Error((data.error && data.error.message) || 'Erro na API do Drive');
        arquivos.push(...data.files);
        pageToken = data.nextPageToken || '';
      } while (pageToken);
      return arquivos;
    }

    // Percorre todas as subpastas (até 5 níveis) e devolve uma lista única de arquivos
    async function carregarAcervo() {
      const resultado = [];
      const visitar = async (folderId, caminho, nivel) => {
        const itens = await listarPasta(folderId);
        const subpastas = [];
        itens.forEach(it => {
          if (it.mimeType === DRIVE_FOLDER_MIME) subpastas.push(it);
          else resultado.push({ ...it, caminho });
        });
        if (nivel < 5) await Promise.all(subpastas.map(p => visitar(p.id, [...caminho, p.name], nivel + 1)));
      };
      await visitar(CONFIG.PASTA_BIBLIOTECA_ID, [], 0);
      return resultado.map(f => ({ ...f, categoria: f.caminho[0] || 'Outros documentos', subcaminho: f.caminho.slice(1) }));
    }

    const ordemCategorias = (a, b) => (a[0] === 'Outros documentos') - (b[0] === 'Outros documentos') || a[0].localeCompare(b[0], 'pt-BR');

    let ACERVO_CACHE = null;

    function Biblioteca() {
      const [arquivos, setArquivos] = useState(ACERVO_CACHE || []);
      const [status, setStatus] = useState(ACERVO_CACHE ? 'ok' : 'carregando');
      const [busca, setBusca] = useState('');
      const [categoria, setCategoria] = useState('');
      const [preview, setPreview] = useState(null);

      useEffect(() => {
        if (ACERVO_CACHE) return;
        carregarAcervo()
          .then(lista => { ACERVO_CACHE = lista; setArquivos(lista); setStatus('ok'); })
          .catch(err => { console.error('[Observatório PNAE] Erro ao carregar a Biblioteca:', err); setStatus('erro'); });
      }, []);

      // Documento aberto fica no endereço (#biblioteca/ID): o botão Voltar funciona e o link pode ser compartilhado
      const idDoHash = () => (window.location.hash.match(/^#biblioteca\/([\w-]+)/) || [])[1] || null;
      const topoRef = React.useRef(null);
      const rolarParaTopo = () => setTimeout(() => {
        const el = topoRef.current;
        if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 90, behavior: 'smooth' });
      }, 30);
      const abrir = (f) => {
        setPreview(f);
        if (idDoHash() !== f.id) window.history.pushState(null, '', '#biblioteca/' + f.id);
        rolarParaTopo();
      };
      const fechar = () => {
        if (idDoHash()) window.history.back();
        else setPreview(null);
      };
      useEffect(() => {
        const sincronizar = () => {
          const id = idDoHash();
          setPreview(id ? (arquivos.find(f => f.id === id) || null) : null);
        };
        if (status === 'ok') sincronizar();
        window.addEventListener('popstate', sincronizar);
        return () => window.removeEventListener('popstate', sincronizar);
      }, [arquivos, status]);
      useEffect(() => {
        const onKey = (e) => { if (e.key === 'Escape' && preview) fechar(); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [preview]);

      const categorias = useMemo(() => {
        const mapa = {};
        arquivos.forEach(f => { mapa[f.categoria] = (mapa[f.categoria] || 0) + 1; });
        return Object.entries(mapa).sort(ordemCategorias);
      }, [arquivos]);

      const termo = normalizar(busca);
      const filtrados = useMemo(() => arquivos
        .filter(f => !categoria || f.categoria === categoria)
        .filter(f => !termo || normalizar(f.name).includes(termo))
        .sort((a, b) => a.name.localeCompare(b.name, 'pt-BR', { numeric: true })), [arquivos, categoria, termo]);

      // Sem busca: agrupa por categoria. Com busca: lista única de resultados.
      const grupos = useMemo(() => {
        if (termo) return [['Resultados', filtrados]];
        const g = {};
        filtrados.forEach(f => { (g[f.categoria] = g[f.categoria] || []).push(f); });
        return Object.entries(g).sort(ordemCategorias);
      }, [filtrados, termo]);

      const destacar = (texto) => {
        if (!termo) return texto;
        const n = normalizar(texto);
        const i = n.indexOf(termo);
        if (i < 0) return texto;
        return (<>{texto.slice(0, i)}<mark className="bg-brand-yellow/50 text-inherit rounded px-0.5">{texto.slice(i, i + termo.length)}</mark>{texto.slice(i + termo.length)}</>);
      };

      const Chip = ({ valor, rotulo, qtd, icone }) => {
        const ativo = categoria === valor;
        return (
          <button
            onClick={() => { setCategoria(valor); if (preview) fechar(); }}
            aria-pressed={ativo}
            className={`shrink-0 lg:w-full flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl text-sm font-bold transition-colors text-left ${ativo ? 'bg-brand-brown text-white shadow' : 'bg-white lg:bg-transparent text-brand-charcoal hover:bg-brand-light/50 border border-brand-light lg:border-transparent'}`}
          >
            <span aria-hidden="true">{icone}</span>
            <span className="flex-grow whitespace-nowrap lg:whitespace-normal">{rotulo}</span>
            <span className={`text-[11px] font-black px-2 py-0.5 rounded-full ${ativo ? 'bg-white/20 text-white' : 'bg-brand-light text-brand-charcoal/70'}`}>{qtd}</span>
          </button>
        );
      };

      return (
        <div className="animate-fade-in">
          {/* Cabeçalho */}
          <section className="bg-brand-brown text-white relative overflow-hidden">
            <span className="absolute -right-20 -top-24 w-72 h-72 rounded-full bg-brand-yellow/10" aria-hidden="true"></span>
            <span className="absolute right-24 -bottom-24 w-56 h-56 rounded-full bg-brand-green/20" aria-hidden="true"></span>
            <div className="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 sm:py-14">
              <span className="text-[11px] font-black uppercase tracking-[0.2em] text-brand-yellow">Biblioteca</span>
              <h1 className="text-3xl sm:text-4xl font-black mt-2">Legislação e Manuais</h1>
              <p className="text-white/85 mt-3 max-w-3xl leading-relaxed">
                Leis, resoluções, cartilhas e notas técnicas que orientam a execução do PNAE no Baixo Sul da Bahia — da Lei nº 11.947/2009 e da Lei nº 15.226/2025 aos guias práticos de chamada pública da agricultura familiar.
              </p>
              <div className="relative mt-7 max-w-2xl">
                <label htmlFor="busca-biblioteca" className="sr-only">Buscar documento</label>
                <input
                  id="busca-biblioteca"
                  type="search"
                  value={busca}
                  onChange={(e) => { setBusca(e.target.value); if (preview) fechar(); }}
                  placeholder="Buscar documento pelo nome (ex.: resolução, chamada pública)..."
                  className="w-full pl-12 pr-4 py-3.5 rounded-2xl border-0 bg-white text-brand-charcoal shadow-lg focus:outline-none focus:ring-4 focus:ring-brand-yellow/60"
                />
                <svg className="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-brand-charcoal/50" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fillRule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clipRule="evenodd" /></svg>
              </div>
              {status === 'ok' && (
                <p className="text-xs text-white/70 mt-3">{arquivos.length} documentos em {categorias.length} categorias</p>
              )}
            </div>
          </section>

          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
            {status === 'carregando' && (
              <div className="space-y-3" aria-live="polite">
                <p className="text-sm text-brand-charcoal/60 mb-4">Carregando o acervo...</p>
                {[0, 1, 2, 3, 4].map(i => <div key={i} className="h-20 rounded-2xl bg-brand-light/50 animate-pulse"></div>)}
              </div>
            )}

            {status === 'erro' && (
              <div className="bg-white rounded-2xl border border-brand-light p-10 text-center">
                <p className="text-3xl mb-2">📚</p>
                <p className="font-bold text-brand-brown">A Biblioteca está temporariamente indisponível.</p>
                <p className="text-sm text-brand-charcoal/60 mt-1">Tente novamente em alguns minutos.</p>
              </div>
            )}

            {status === 'ok' && (
              <div className="flex flex-col lg:flex-row gap-8">
                {/* Categorias */}
                <aside className={`lg:w-64 shrink-0 ${preview ? 'hidden lg:block' : ''}`}>
                  <h2 className="hidden lg:block text-[11px] font-black uppercase tracking-wider text-brand-charcoal/50 mb-3 px-1">Categorias</h2>
                  <nav className="flex lg:flex-col gap-2 lg:gap-1 overflow-x-auto pb-2 lg:pb-0 -mx-4 px-4 lg:mx-0 lg:px-0 lg:sticky lg:top-24" aria-label="Categorias da biblioteca">
                    <Chip valor="" rotulo="Todos os documentos" qtd={arquivos.length} icone="📚" />
                    {categorias.map(([nome, qtd]) => (
                      <Chip key={nome} valor={nome} rotulo={capitalizar(nome)} qtd={qtd} icone={ICONE_CATEGORIA(nome)} />
                    ))}
                  </nav>
                </aside>

                {/* Documento aberto (na própria página) */}
                {preview && (() => {
                  const tipo = tipoArquivo(preview);
                  const vizinhos = filtrados.length ? filtrados : arquivos;
                  const idx = vizinhos.findIndex(f => f.id === preview.id);
                  const anterior = idx > 0 ? vizinhos[idx - 1] : null;
                  const proximo = idx >= 0 && idx < vizinhos.length - 1 ? vizinhos[idx + 1] : null;
                  return (
                    <div ref={topoRef} className="flex-grow min-w-0 animate-fade-in">
                      <button onClick={fechar} className="inline-flex items-center gap-1.5 text-sm font-bold text-brand-primary hover:underline mb-4">
                        <span aria-hidden="true">←</span> Voltar para a lista
                      </button>
                      <article className="bg-white rounded-2xl border border-brand-light shadow-sm overflow-hidden">
                        <header className="flex flex-col sm:flex-row sm:items-center gap-4 p-5 border-b border-brand-light">
                          <span className="w-12 h-14 rounded-lg flex flex-col items-center justify-center shrink-0 text-[9px] font-black uppercase tracking-wide" style={{ backgroundColor: tipo.fundo, color: tipo.cor }}>
                            <svg className="w-5 h-5 mb-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
                            {tipo.rotulo.length > 5 ? tipo.rotulo.slice(0, 4) : tipo.rotulo}
                          </span>
                          <div className="flex-grow min-w-0">
                            <p className="text-[11px] font-bold text-brand-charcoal/55 truncate">{[capitalizar(preview.categoria), ...preview.subcaminho].join(' › ')}</p>
                            <h2 className="text-lg sm:text-xl font-black text-brand-brown leading-snug">{nomeSemExtensao(preview.name)}</h2>
                            <p className="text-[11px] text-brand-charcoal/55 mt-0.5">{[tipo.rotulo, formatarTamanho(preview.size)].filter(Boolean).join(' · ')}</p>
                          </div>
                          <a href={linkDownload(preview)} target="_blank" rel="noopener noreferrer" className="self-start sm:self-auto shrink-0 inline-flex items-center gap-2 bg-brand-brown hover:bg-brand-darkBrown text-white text-sm font-bold py-2.5 px-5 rounded-xl shadow-sm">
                            <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
                            Baixar
                          </a>
                        </header>
                        <iframe
                          key={preview.id}
                          src={`https://drive.google.com/file/d/${preview.id}/preview`}
                          title={preview.name}
                          className="w-full border-0 bg-brand-cream block"
                          style={{ height: 'calc(100vh - 140px)', minHeight: '520px' }}
                          allow="autoplay"
                        ></iframe>
                      </article>
                      {(anterior || proximo) && (
                        <nav className="grid grid-cols-2 gap-3 mt-4" aria-label="Outros documentos">
                          <div>
                            {anterior && (
                              <button onClick={() => abrir(anterior)} className="w-full text-left bg-white border border-brand-light rounded-xl p-3 hover:border-brand-green/50">
                                <span className="block text-[10px] font-bold uppercase text-brand-charcoal/50">← Anterior</span>
                                <span className="block text-sm font-bold text-brand-brown truncate">{nomeSemExtensao(anterior.name)}</span>
                              </button>
                            )}
                          </div>
                          <div>
                            {proximo && (
                              <button onClick={() => abrir(proximo)} className="w-full text-right bg-white border border-brand-light rounded-xl p-3 hover:border-brand-green/50">
                                <span className="block text-[10px] font-bold uppercase text-brand-charcoal/50">Próximo →</span>
                                <span className="block text-sm font-bold text-brand-brown truncate">{nomeSemExtensao(proximo.name)}</span>
                              </button>
                            )}
                          </div>
                        </nav>
                      )}
                    </div>
                  );
                })()}

                {/* Lista de documentos */}
                <div className={`flex-grow min-w-0 space-y-10 ${preview ? 'hidden' : ''}`}>
                  {termo && (
                    <div className="flex flex-wrap items-center justify-between gap-2 text-sm">
                      <span className="text-brand-charcoal/70">
                        <strong className="text-brand-brown">{filtrados.length}</strong> documento(s) para "{busca}"{categoria ? ` em ${capitalizar(categoria)}` : ''}
                      </span>
                      <button onClick={() => setBusca('')} className="text-xs font-bold text-brand-primary hover:underline">Limpar busca</button>
                    </div>
                  )}

                  {filtrados.length === 0 && (
                    <div className="bg-white rounded-2xl border border-brand-light p-10 text-center">
                      <p className="text-3xl mb-2">🔎</p>
                      <p className="font-bold text-brand-brown">{termo ? 'Nenhum documento encontrado.' : 'Nenhum documento nesta categoria ainda.'}</p>
                      {termo && <p className="text-sm text-brand-charcoal/60 mt-1">Tente outra palavra ou escolha "Todos os documentos".</p>}
                    </div>
                  )}

                  {grupos.map(([grupo, lista]) => (
                    <section key={grupo}>
                      {!termo && (
                        <div className="flex items-center gap-3 mb-4">
                          <span className="text-xl" aria-hidden="true">{ICONE_CATEGORIA(grupo)}</span>
                          <h2 className="text-lg font-black text-brand-brown">{capitalizar(grupo)}</h2>
                          <span className="text-xs font-bold text-brand-charcoal/50">{lista.length} {lista.length === 1 ? 'documento' : 'documentos'}</span>
                          <span className="flex-grow border-t border-brand-light ml-2"></span>
                        </div>
                      )}
                      <ul className="grid grid-cols-1 xl:grid-cols-2 gap-3">
                        {lista.map(f => {
                          const tipo = tipoArquivo(f);
                          const local = [f.categoria !== 'Outros documentos' ? capitalizar(f.categoria) : null, ...f.subcaminho].filter(Boolean).join(' › ');
                          return (
                            <li key={f.id} className="group bg-white rounded-2xl border border-brand-light hover:border-brand-green/50 hover:shadow-md transition-all p-4 flex items-center gap-4">
                              <span className="w-12 h-14 rounded-lg flex flex-col items-center justify-center shrink-0 text-[9px] font-black uppercase tracking-wide" style={{ backgroundColor: tipo.fundo, color: tipo.cor }}>
                                <svg className="w-5 h-5 mb-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
                                {tipo.rotulo.length > 5 ? tipo.rotulo.slice(0, 4) : tipo.rotulo}
                              </span>
                              <button onClick={() => abrir(f)} className="flex-grow min-w-0 text-left">
                                <span className="block font-bold text-brand-brown text-sm leading-snug line-clamp-2 group-hover:text-brand-darkGreen">{destacar(nomeSemExtensao(f.name))}</span>
                                <span className="block text-[11px] text-brand-charcoal/55 mt-1 truncate">
                                  {[(termo || f.subcaminho.length) ? local : null, tipo.rotulo, formatarTamanho(f.size)].filter(Boolean).join(' · ')}
                                </span>
                              </button>
                              <div className="flex items-center gap-1.5 shrink-0">
                                <button onClick={() => abrir(f)} title="Visualizar" aria-label={`Visualizar ${f.name}`} className="w-9 h-9 rounded-lg flex items-center justify-center text-brand-charcoal/70 hover:bg-brand-cream hover:text-brand-brown border border-brand-light">
                                  <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                </button>
                                <a href={linkDownload(f)} target="_blank" rel="noopener noreferrer" title="Baixar" aria-label={`Baixar ${f.name}`} className="w-9 h-9 rounded-lg flex items-center justify-center bg-brand-brown text-white hover:bg-brand-darkBrown">
                                  <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
                                </a>
                              </div>
                            </li>
                          );
                        })}
                      </ul>
                    </section>
                  ))}
                </div>
              </div>
            )}
          </div>

        </div>
      );
    }

    // =====================================================================================
    // MUNICÍPIOS (lista com mapa + painel de cada município)
    // =====================================================================================
    const FONTES_MUNICIPIO = {
      repasse: { rotulo: 'FNDE — Consulta de liberações (PNAE, 2025)', url: CONFIG.FNDE_URL },
      alunos: { rotulo: 'Inep — Censo Escolar 2025 (via QEdu)', url: 'https://qedu.org.br/uf/29-bahia/censo-escolar' },
    };
    const ORDENS_MUNICIPIO = [
      { key: 'nome', rotulo: 'A–Z', fn: (a, b) => a.nome.localeCompare(b.nome, 'pt-BR') },
      { key: 'repasse', rotulo: 'Maior repasse', fn: (a, b) => b.valorContratado - a.valorContratado },
      { key: 'alunos', rotulo: 'Mais alunos', fn: (a, b) => b.alunosRedeMunicipal - a.alunosRedeMunicipal }
    ];

    function MapaMunicipios({ destaque, onHover, onAbrir, selecionadoId }) {
      return (
        <div className="relative rounded-2xl overflow-hidden border border-brand-light bg-brand-cream">
          <Img src={CONFIG.MAPA_URL} alt="Mapa dos municípios do CIAPRA no Baixo Sul da Bahia" className="w-full h-auto block" />
          {MUNICIPIOS.map(m => {
            const ativo = destaque === m.id || selecionadoId === m.id;
            return (
              <button
                key={m.id}
                onClick={() => onAbrir(m)}
                onMouseEnter={() => onHover && onHover(m.id)}
                onMouseLeave={() => onHover && onHover(null)}
                onFocus={() => onHover && onHover(m.id)}
                onBlur={() => onHover && onHover(null)}
                className="absolute -translate-x-1/2 -translate-y-1/2 group focus:outline-none"
                style={{ left: `${m.coord_x}%`, top: `${m.coord_y}%`, zIndex: ativo ? 20 : 10 }}
                aria-label={`Abrir ${m.nome}`}
              >
                <span className={`block rounded-full border-2 border-white shadow-lg transition-all duration-200 ${ativo ? 'w-5 h-5 bg-brand-brown ring-4 ring-brand-yellow/60' : 'w-3.5 h-3.5 bg-brand-yellow group-hover:scale-125'}`}></span>
                <span className={`absolute left-1/2 -translate-x-1/2 bottom-full mb-1.5 whitespace-nowrap bg-brand-brown text-white text-[11px] font-bold px-2 py-1 rounded-md shadow-lg pointer-events-none transition-opacity ${ativo ? 'opacity-100' : 'opacity-0 group-hover:opacity-100'}`}>{m.nome}</span>
              </button>
            );
          })}
        </div>
      );
    }

    function Municipios({ selecionado, onAbrir, onVoltar, editais, onVerEditais, onAmpliar }) {
      const [busca, setBusca] = useState('');
      const [ordem, setOrdem] = useState('nome');
      const [hover, setHover] = useState(null);

      const totais = useMemo(() => ({
        repasse: MUNICIPIOS.reduce((a, m) => a + m.valorContratado, 0),
        alunos: MUNICIPIOS.reduce((a, m) => a + m.alunosRedeMunicipal, 0),
        agricultores: MUNICIPIOS.reduce((a, m) => a + (m.agricultores || 0), 0)
      }), []);
      const mediaPorAluno = totais.repasse / totais.alunos;

      const lista = useMemo(() => {
        const t = normalizar(busca);
        const fn = ORDENS_MUNICIPIO.find(o => o.key === ordem).fn;
        return MUNICIPIOS.filter(m => !t || normalizar(`${m.nome} ${m.nutricionista}`).includes(t)).sort(fn);
      }, [busca, ordem]);

      if (selecionado) {
        return <PainelMunicipio m={selecionado} onVoltar={onVoltar} onAbrir={onAbrir} editais={editais} onVerEditais={onVerEditais} onAmpliar={onAmpliar} mediaPorAluno={mediaPorAluno} />;
      }

      return (
        <div className="animate-fade-in">
          <section className="bg-brand-brown text-white relative overflow-hidden">
            <span className="absolute -right-20 -top-24 w-72 h-72 rounded-full bg-brand-yellow/10" aria-hidden="true"></span>
            <span className="absolute right-32 -bottom-28 w-56 h-56 rounded-full bg-brand-green/20" aria-hidden="true"></span>
            <div className="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 sm:py-12">
              <span className="text-[11px] font-black uppercase tracking-[0.2em] text-brand-yellow">Municípios</span>
              <h1 className="text-3xl sm:text-4xl font-black mt-2">Os 16 municípios do território</h1>
              <p className="text-white/85 mt-3 max-w-3xl leading-relaxed">Repasses do PNAE, alunos atendidos, metas de compra da agricultura familiar e a nutricionista responsável em cada município consorciado ao CIAPRA.</p>
              <dl className="grid grid-cols-2 lg:grid-cols-4 gap-3 mt-7 max-w-4xl">
                {[
                  ['Municípios', String(MUNICIPIOS.length)],
                  ['Alunos na rede municipal', totais.alunos.toLocaleString('pt-BR')],
                  ['Repasse PNAE 2025', moedaCompacta(totais.repasse)],
                  ['Agricultores familiares (CAF)', totais.agricultores.toLocaleString('pt-BR')]
                ].map(([r, v]) => (
                  <div key={r} className="bg-white/10 border border-white/15 rounded-xl px-4 py-3">
                    <dt className="text-[11px] text-white/70 font-bold">{r}</dt>
                    <dd className="text-xl sm:text-2xl font-black mt-0.5">{v}</dd>
                  </div>
                ))}
              </dl>
            </div>
          </section>

          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
            <div className="flex flex-col md:flex-row md:items-center gap-3 mb-6">
              <div className="relative flex-grow max-w-md">
                <label htmlFor="busca-municipio" className="sr-only">Buscar município</label>
                <input id="busca-municipio" type="search" value={busca} onChange={(e) => setBusca(e.target.value)} placeholder="Buscar município ou nutricionista..." className="w-full pl-11 pr-4 py-2.5 rounded-xl border border-brand-light bg-white text-brand-charcoal focus:outline-none focus:ring-2 focus:ring-brand-primary" />
                <svg className="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-brand-charcoal/50" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fillRule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clipRule="evenodd" /></svg>
              </div>
              <div className="flex items-center gap-2 overflow-x-auto pb-1" role="group" aria-label="Ordenar municípios">
                <span className="text-xs font-bold text-brand-charcoal/60 shrink-0">Ordenar:</span>
                {ORDENS_MUNICIPIO.map(o => (
                  <button key={o.key} onClick={() => setOrdem(o.key)} aria-pressed={ordem === o.key} className={`shrink-0 text-xs font-bold px-3 py-1.5 rounded-full border transition-colors ${ordem === o.key ? 'bg-brand-brown text-white border-brand-brown' : 'bg-white text-brand-charcoal border-brand-light hover:border-brand-brown/40'}`}>{o.rotulo}</button>
                ))}
              </div>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
              <aside className="lg:col-span-5 lg:sticky lg:top-24 space-y-3">
                <MapaMunicipios destaque={hover} onHover={setHover} onAbrir={onAbrir} />
                <p className="text-[11px] text-brand-charcoal/60">Clique em um pino ou em um cartão para abrir o painel do município.</p>
              </aside>

              <div className="lg:col-span-7">
                {lista.length === 0 && (
                  <div className="bg-white rounded-2xl border border-brand-light p-10 text-center text-sm text-brand-charcoal/60">Nenhum município encontrado para "{busca}".</div>
                )}
                <ul className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  {lista.map(m => (
                    <li key={m.id}>
                      <button
                        onClick={() => onAbrir(m)}
                        onMouseEnter={() => setHover(m.id)}
                        onMouseLeave={() => setHover(null)}
                        onFocus={() => setHover(m.id)}
                        onBlur={() => setHover(null)}
                        className={`w-full h-full text-left bg-white rounded-2xl border p-4 transition-all duration-200 ${hover === m.id ? 'border-brand-yellow shadow-lg -translate-y-0.5' : 'border-brand-light shadow-sm'}`}
                      >
                        <div className="flex items-center gap-3">
                          <span className="w-12 h-12 rounded-full bg-brand-cream border border-brand-light flex items-center justify-center overflow-hidden shrink-0">
                            <Img src={m.logo} alt="" className="w-full h-full object-contain p-1" />
                          </span>
                          <span className="min-w-0 flex-grow">
                            <span className="block font-black text-brand-brown leading-tight truncate">{m.nome}</span>
                            <span className="block text-[11px] text-brand-charcoal/60 truncate">Nutri: {m.nutricionista}</span>
                          </span>
                        </div>
                        <dl className="grid grid-cols-3 gap-2 mt-4 pt-3 border-t border-brand-light/70">
                          <div>
                            <dt className="text-[10px] font-bold text-brand-charcoal/50 uppercase">Alunos</dt>
                            <dd className="text-sm font-black text-brand-charcoal">{m.alunosRedeMunicipal.toLocaleString('pt-BR')}</dd>
                          </div>
                          <div>
                            <dt className="text-[10px] font-bold text-brand-charcoal/50 uppercase">Repasse 2025</dt>
                            <dd className="text-sm font-black text-brand-charcoal whitespace-nowrap">{moedaCompacta(m.valorContratado)}</dd>
                          </div>
                          <div>
                            <dt className="text-[10px] font-bold text-brand-charcoal/50 uppercase">Agricultores</dt>
                            <dd className="text-sm font-black text-brand-charcoal">{(m.agricultores || 0).toLocaleString('pt-BR')}</dd>
                          </div>
                        </dl>
                        <span className="flex items-center justify-end gap-1 text-xs font-bold text-brand-darkGreen mt-3">Ver painel do município <span aria-hidden="true">→</span></span>
                      </button>
                    </li>
                  ))}
                </ul>
                <p className="text-[10px] text-brand-charcoal/50 mt-5 leading-relaxed">
                  Fontes: FNDE (repasses pagos em 2025), Inep — Censo Escolar 2025 (alunos da rede municipal) e MDA — CAF (agricultores, informado pelo CIAPRA).
                </p>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function PainelMunicipio({ m, onVoltar, onAbrir, editais, onVerEditais, onAmpliar, mediaPorAluno }) {
      const ordenados = useMemo(() => [...MUNICIPIOS].sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR')), []);
      const idx = ordenados.findIndex(x => x.id === m.id);
      const anterior = ordenados[(idx - 1 + ordenados.length) % ordenados.length];
      const proximo = ordenados[(idx + 1) % ordenados.length];
      const porAluno = m.valorContratado / m.alunosRedeMunicipal;
      const difMedia = (porAluno / mediaPorAluno - 1) * 100;
      const meusEditais = (editais || []).filter(e => e.municipio === m.nome);
      const maxMod = Math.max(...m.repasseModalidades.map(x => x[1]));
      const temEmail = m.email && m.email !== '—';
      const temRegistro = m.registro && m.registro !== '—';

      return (
        <div className="animate-fade-in">
          {/* Topo */}
          <section className="bg-brand-brown text-white relative overflow-hidden">
            <span className="absolute -right-16 -top-24 w-72 h-72 rounded-full bg-brand-yellow/10" aria-hidden="true"></span>
            <div className="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 pb-10">
              <div className="flex items-center justify-between gap-3 text-sm">
                <button onClick={onVoltar} className="inline-flex items-center gap-1.5 font-bold text-brand-yellow hover:underline"><span aria-hidden="true">←</span> Todos os municípios</button>
                <div className="flex items-center gap-1">
                  <button onClick={() => onAbrir(anterior)} className="px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-xs font-bold" title={`Anterior: ${anterior.nome}`}>‹ <span className="hidden sm:inline">{anterior.nome}</span></button>
                  <button onClick={() => onAbrir(proximo)} className="px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-xs font-bold" title={`Próximo: ${proximo.nome}`}><span className="hidden sm:inline">{proximo.nome}</span> ›</button>
                </div>
              </div>
              <div className="flex flex-col md:flex-row md:items-center gap-6 mt-6">
                <span className="w-24 h-24 rounded-2xl bg-white flex items-center justify-center overflow-hidden shadow-xl shrink-0">
                  <Img src={m.logo} alt={`Brasão de ${m.nome}`} className="w-full h-full object-contain p-2" />
                </span>
                <div className="flex-grow min-w-0">
                  <span className="text-[11px] font-black uppercase tracking-[0.2em] text-brand-yellow">Município · Baixo Sul da Bahia</span>
                  <h1 className="text-3xl sm:text-4xl font-black leading-tight mt-1">{m.nome}</h1>
                  <p className="text-white/80 mt-2 max-w-2xl leading-relaxed">{m.descricao}</p>
                </div>
                {/* Nutricionista */}
                <div className="bg-white text-brand-charcoal rounded-2xl p-4 flex items-center gap-4 shadow-xl md:max-w-sm shrink-0">
                  {m.fotoNutricionista ? (
                    <button onClick={() => onAmpliar(m.fotoNutricionista)} className="shrink-0" aria-label="Ampliar foto da nutricionista">
                      <Img src={m.fotoNutricionista} alt={`Foto de ${m.nutricionista}`} className="w-16 h-16 rounded-full object-cover object-top border-2 border-brand-yellow" />
                    </button>
                  ) : (
                    <span className="w-16 h-16 rounded-full bg-brand-cream border-2 border-brand-light flex items-center justify-center text-2xl shrink-0" aria-hidden="true">🥗</span>
                  )}
                  <div className="min-w-0">
                    <span className="block text-[10px] font-black uppercase tracking-wide text-brand-charcoal/50">Nutricionista responsável técnica</span>
                    <span className="block font-black text-brand-brown leading-tight">{m.nutricionista}</span>
                    {temRegistro && <span className="block text-[11px] text-brand-charcoal/60">{m.registro}</span>}
                    {temEmail && <a href={`mailto:${m.email}`} className="block text-[11px] text-brand-darkGreen font-bold hover:underline truncate">{m.email}</a>}
                  </div>
                </div>
              </div>
            </div>
          </section>

          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 space-y-8">
            {/* Indicadores */}
            <section className="grid grid-cols-2 lg:grid-cols-4 gap-4" aria-label="Indicadores do município">
              <div className="bg-white rounded-2xl border border-brand-light p-5 shadow-sm">
                <span className="text-xs font-bold text-brand-charcoal/60">Repasse PNAE 2025</span>
                <span className="block text-2xl sm:text-3xl font-black text-brand-brown mt-1 whitespace-nowrap">{moedaCompacta(m.valorContratado)}</span>
                <span className="block text-[11px] text-brand-charcoal/55 mt-1">{formatarMoeda(m.valorContratado)} · {m.repasseParcelas} parcelas pagas</span>
              </div>
              <div className="bg-white rounded-2xl border border-brand-light p-5 shadow-sm">
                <span className="text-xs font-bold text-brand-charcoal/60">Alunos na rede municipal</span>
                <span className="block text-2xl sm:text-3xl font-black text-brand-brown mt-1">{m.alunosRedeMunicipal.toLocaleString('pt-BR')}</span>
                <span className="block text-[11px] text-brand-charcoal/55 mt-1">Censo Escolar 2025 (Inep)</span>
              </div>
              <div className="bg-white rounded-2xl border border-brand-light p-5 shadow-sm">
                <span className="text-xs font-bold text-brand-charcoal/60">Repasse por aluno</span>
                <span className="block text-2xl sm:text-3xl font-black text-brand-brown mt-1">{moedaCompacta(porAluno)}</span>
                <span className="block text-[11px] text-brand-charcoal/55 mt-1">
                  {Math.abs(difMedia) < 1 ? 'Na média do território' : `${difMedia > 0 ? '▲' : '▼'} ${Math.abs(difMedia).toFixed(0)}% ${difMedia > 0 ? 'acima' : 'abaixo'} da média do território (${moedaCompacta(mediaPorAluno)})`}
                </span>
              </div>
              <div className="bg-white rounded-2xl border border-brand-light p-5 shadow-sm">
                <span className="text-xs font-bold text-brand-charcoal/60">Agricultores familiares</span>
                <span className="block text-2xl sm:text-3xl font-black text-brand-brown mt-1">{(m.agricultores || 0).toLocaleString('pt-BR')}</span>
                <span className="block text-[11px] text-brand-charcoal/55 mt-1">Cadastrados no CAF (MDA), informado pelo CIAPRA</span>
              </div>
            </section>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
              {/* Agricultura familiar: meta legal (destaque) + compra registrada em 2022 */}
              <section className="bg-white rounded-2xl border border-brand-light p-6 shadow-sm">
                <h2 className="text-lg font-black text-brand-brown">Meta legal da agricultura familiar</h2>
                <p className="text-xs text-brand-charcoal/60 mt-0.5">Valor mínimo do repasse que deve ser usado na compra de alimentos da agricultura familiar, calculado sobre o total pago pelo FNDE em 2025 ({formatarMoeda(m.valorContratado)})</p>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-5">
                  <div className="rounded-xl bg-brand-cream border border-brand-light p-4">
                    <span className="block text-[10px] font-bold uppercase text-brand-charcoal/50">Até 2025 · 30% do repasse</span>
                    <span className="block text-xl font-black text-brand-brown mt-1">{formatarMoeda(m.valorContratado * 0.3)}</span>
                    <span className="block text-[11px] text-brand-charcoal/55 mt-1">Lei nº 11.947/2009</span>
                  </div>
                  <div className="rounded-xl bg-brand-green/10 border border-brand-green/30 p-4">
                    <span className="block text-[10px] font-bold uppercase text-brand-darkGreen">Desde 2026 · 45% do repasse</span>
                    <span className="block text-xl font-black text-brand-darkGreen mt-1">{formatarMoeda(m.valorContratado * 0.45)}</span>
                    <span className="block text-[11px] text-brand-charcoal/55 mt-1">Lei nº 15.226/2025</span>
                  </div>
                </div>
                <p className="text-[10px] text-brand-charcoal/50 mt-2">Valores mínimos previstos em lei, não o valor efetivamente comprado.</p>

                <div className="mt-7 pt-6 border-t border-brand-light">
                  <div className="flex items-start justify-between gap-3">
                    <div>
                      <h3 className="text-sm font-black text-brand-brown">Compra registrada pelo FNDE</h3>
                      <p className="text-xs text-brand-charcoal/60 mt-0.5">Parte do repasse gasta com a agricultura familiar</p>
                    </div>
                    <span className="shrink-0 inline-flex items-center gap-1.5 text-[11px] font-black uppercase tracking-wide px-3 py-1.5 rounded-full bg-brand-yellow/30 text-brand-brown border border-brand-yellow">
                      <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                      Dado de 2022
                    </span>
                  </div>
                  <div className="mt-4 rounded-xl border-l-4 border-brand-yellow bg-brand-yellow/10 px-4 py-3 text-xs text-brand-charcoal leading-relaxed">
                    <strong className="text-brand-brown">Atenção: este é um dado de 2022.</strong> É o último ano publicado pelo FNDE por município (dado preliminar). Pode não refletir a situação atual do município.
                  </div>

                  {m.percentualAF2022 != null ? (() => {
                    const pct = m.percentualAF2022;
                    const ESCALA = 70;
                    const cor = pct >= 30 ? '#327025' : '#9A3412';
                    const situacao = pct >= 45 ? 'Acima de 45%, a meta em vigor desde 2026' : pct >= 30 ? 'Acima do mínimo de 30% exigido em 2022' : 'Abaixo do mínimo de 30% exigido em 2022';
                    return (
                      <div className="mt-5">
                        <div className="flex items-baseline gap-2">
                          <span className="text-3xl font-black" style={{ color: cor }}>{pct.toLocaleString('pt-BR', { maximumFractionDigits: 2 })}%</span>
                          <span className="text-sm font-bold text-brand-charcoal/70">em 2022</span>
                        </div>
                        <p className="text-xs font-bold mt-1" style={{ color: cor }}>{situacao}</p>
                        <div className="relative h-3.5 rounded-full bg-brand-green/10 mt-7">
                          <span className="absolute left-0 top-0 h-full rounded-full transition-all duration-700" style={{ width: `${Math.min(100, (pct / ESCALA) * 100)}%`, backgroundColor: cor }}></span>
                          {[30, 45].map(r => (
                            <span key={r} className="absolute -top-2 -bottom-2 border-l-2 border-dashed border-brand-charcoal/60" style={{ left: `${(r / ESCALA) * 100}%` }} aria-hidden="true">
                              <span className="absolute -top-5 -translate-x-1/2 text-[10px] font-black text-brand-charcoal/70 whitespace-nowrap">{r}%</span>
                            </span>
                          ))}
                        </div>
                        <div className="flex justify-between text-[10px] text-brand-charcoal/50 mt-2"><span>0%</span><span>{ESCALA}%</span></div>
                        {m.percentualAFNota && <p className="text-xs text-brand-charcoal/70 mt-3">{m.percentualAFNota}</p>}
                      </div>
                    );
                  })() : (
                    <p className="text-sm text-brand-charcoal mt-4 bg-brand-cream rounded-xl p-4">{m.percentualAFNota || 'O FNDE não publicou o percentual deste município para 2022.'}</p>
                  )}
                </div>

                <footer className="mt-6 pt-4 border-t border-dashed border-brand-light flex items-start gap-2 text-[11px] text-brand-charcoal/65 leading-relaxed">
                  <svg className="w-4 h-4 shrink-0 mt-0.5 text-brand-darkGreen" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
                  <span>
                    Quando o FNDE publicar dados mais recentes sobre as compras da agricultura familiar, eles serão atualizados aqui no Observatório.{' '}
                    <a href="https://www.gov.br/fnde/pt-br/acesso-a-informacao/acoes-e-programas/programas/pnae/consultas/pnae-dados-da-agricultura-familiar" target="_blank" rel="noopener noreferrer" className="font-bold text-brand-primary hover:underline whitespace-nowrap">Fonte: FNDE ↗</a>
                  </span>
                </footer>
              </section>

              {/* Repasse por modalidade */}
              <section className="bg-white rounded-2xl border border-brand-light p-6 shadow-sm">
                <h2 className="text-lg font-black text-brand-brown">Repasse por etapa de ensino</h2>
                <p className="text-xs text-brand-charcoal/60 mt-0.5">Total pago pelo FNDE em 2025: {formatarMoeda(m.valorContratado)}</p>
                <ul className="mt-5 space-y-3">
                  {m.repasseModalidades.map(([nome, valor]) => (
                    <li key={nome}>
                      <div className="flex items-baseline justify-between gap-3 text-xs">
                        <span className="font-bold text-brand-charcoal">{nome === 'AEE' ? 'Atendimento Educacional Especializado (AEE)' : nome}</span>
                        <span className="tabular-nums text-brand-charcoal/70 whitespace-nowrap"><strong className="text-brand-brown">{formatarMoeda(valor)}</strong> · {((valor / m.valorContratado) * 100).toLocaleString('pt-BR', { maximumFractionDigits: 1 })}%</span>
                      </div>
                      <div className="h-2.5 rounded-full bg-brand-light/60 mt-1.5 overflow-hidden">
                        <div className="h-full rounded-r-[4px] bg-brand-darkGreen" style={{ width: `${(valor / maxMod) * 100}%` }}></div>
                      </div>
                    </li>
                  ))}
                </ul>
                <a href={CONFIG.FNDE_URL} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-1 text-xs font-bold text-brand-primary hover:underline mt-5">Conferir no site do FNDE ↗</a>
              </section>
            </div>

            {/* Editais */}
            <section className="bg-white rounded-2xl border border-brand-light p-6 shadow-sm">
              <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
                <div>
                  <h2 className="text-lg font-black text-brand-brown">Chamadas públicas</h2>
                  <p className="text-xs text-brand-charcoal/60 mt-0.5">Editais da alimentação escolar registrados para {m.nome}</p>
                </div>
                {meusEditais.length > 0 && <button onClick={() => onVerEditais(m.nome)} className="text-xs font-bold text-brand-primary hover:underline">Ver relatório completo →</button>}
              </div>
              {meusEditais.length === 0 ? (
                <p className="text-sm text-brand-charcoal/60 bg-brand-cream rounded-xl p-4">Nenhuma chamada pública registrada até o momento.</p>
              ) : (
                <ul className="divide-y divide-brand-light">
                  {meusEditais.map(ed => (
                    <li key={ed.id} className="py-3 flex flex-wrap items-center gap-3">
                      <span className={`text-[10px] font-black uppercase px-2.5 py-1 rounded-full ${ed.situacao === 'Aberto' ? 'bg-brand-green/20 text-brand-darkGreen' : 'bg-brand-light text-brand-charcoal/60'}`}>{ed.situacao}</span>
                      <span className="flex-grow min-w-0">
                        <span className="block font-bold text-brand-brown text-sm">{ed.numero}</span>
                        <span className="block text-[11px] text-brand-charcoal/60">Fechamento: {ed.data} · Contrato: {ed.valorContrato}</span>
                      </span>
                      <LinkEdital href={ed.linkEdital} compacto />
                    </li>
                  ))}
                </ul>
              )}
            </section>

            {/* Fontes */}
            <footer className="text-[11px] text-brand-charcoal/60 leading-relaxed">
              <span className="font-bold text-brand-charcoal/70">Fontes: </span>
              {Object.values(FONTES_MUNICIPIO).map((f, i) => (
