                <React.Fragment key={f.url}>{i > 0 && ' · '}<a href={f.url} target="_blank" rel="noopener noreferrer" className="underline hover:text-brand-brown">{f.rotulo}</a></React.Fragment>
              ))}
              {' · '}Agricultores no CAF e dados da nutricionista: informados pelo CIAPRA e pelas prefeituras.
            </footer>
          </div>
        </div>
      );
    }

    const municipioDoHash = () => {
      const id = (window.location.hash.match(/^#municipios\/([\w-]+)/) || [])[1];
      return id ? (MUNICIPIOS.find(m => m.id === id) || null) : null;
    };

    const viewFromHash = () => {
      const h = window.location.hash.replace('#', '').split('/')[0];
      return VIEWS.includes(h) ? h : 'home';
    };

    // =====================================================================================
    // APLICAÇÃO
    // =====================================================================================
    function App() {
      const [view, setView] = useState(viewFromHash);
      const [selectedMunicipio, setSelectedMunicipio] = useState(null);
      const [selectedNoticia, setSelectedNoticia] = useState(null);
      const [relatorioMunicipio, setRelatorioMunicipio] = useState(null);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [toast, setToast] = useState(null);

      // Acessibilidade
      const [fontSize, setFontSize] = useState(16);
      const [highContrast, setHighContrast] = useState(false);
      const [srMensagem, setSrMensagem] = useState('');

      // Busca e filtros
      const [globalSearch, setGlobalSearch] = useState('');
      const [filtroMuni, setFiltroMuni] = useState('');
      const [filtroSit, setFiltroSit] = useState('');
      const [visualizacaoEditais, setVisualizacaoEditais] = useState('cards');

      // Dados das planilhas
      const [editais, setEditais] = useState([]);
      const [statusEditais, setStatusEditais] = useState('carregando'); // carregando | ok | erro
      const [noticias, setNoticias] = useState([]);
      const [statusNoticias, setStatusNoticias] = useState('carregando');


      const [imagemAmpliada, setImagemAmpliada] = useState(null);
      const [logoErro, setLogoErro] = useState(false);

      // Carrosséis
      const [activeSlide, setActiveSlide] = useState(0);
      const [isHovered, setIsHovered] = useState(false);
      const [visibleCount, setVisibleCount] = useState(4);
      const [featuredSlideIndex, setFeaturedSlideIndex] = useState(0);
      const [isFeaturedHovered, setIsFeaturedHovered] = useState(false);

      // Filtros públicos de notícias
      const [newsSearch, setNewsSearch] = useState('');
      const [newsMunicipio, setNewsMunicipio] = useState('');
      const [newsCategoria, setNewsCategoria] = useState('');
      const [newsDataDe, setNewsDataDe] = useState('');
      const [newsDataAte, setNewsDataAte] = useState('');


      const triggerToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4000);
      };
      const anunciar = (msg) => {
        setSrMensagem(msg);
        setTimeout(() => setSrMensagem(''), 3000);
      };

      // ---- Navegação (cada seção tem endereço próprio, ex: /#editais, e o botão Voltar funciona) ----
      const limparSelecoes = () => {
        setSelectedMunicipio(null);
        setSelectedNoticia(null);
        setRelatorioMunicipio(null);
        setMobileMenuOpen(false);
        setGlobalSearch('');
      };
      const irPara = (v) => {
        limparSelecoes();
        setView(v);
        const novoHash = v === 'home' ? '' : '#' + v;
        if (window.location.hash !== novoHash) {
          window.history.pushState(null, '', novoHash || window.location.pathname);
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
      useEffect(() => {
        const onPop = () => { limparSelecoes(); setView(viewFromHash()); setSelectedMunicipio(municipioDoHash()); };
        setSelectedMunicipio(municipioDoHash());
        window.addEventListener('popstate', onPop);
        return () => window.removeEventListener('popstate', onPop);
      }, []);

      const abrirMunicipio = (m) => {
        setGlobalSearch('');
        setMobileMenuOpen(false);
        setView('municipios');
        setSelectedMunicipio(m);
        const alvo = '#municipios/' + m.id;
        if (window.location.hash !== alvo) window.history.pushState(null, '', alvo);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
      const voltarMunicipios = () => {
        if (municipioDoHash()) window.history.back();
        else setSelectedMunicipio(null);
      };

      const abrirNoticia = (item) => {
        irPara('noticias');
        setSelectedNoticia(item);
      };

      // ---- Carregamento das planilhas ----
      const carregarEditais = useCallback(async () => {
        setStatusEditais('carregando');
        const linhas = await lerPlanilhaPublicada(CONFIG.PLANILHA_EDITAIS_URL, (l) => processarEditais(l).length > 0);
        if (linhas) {
          setEditais(processarEditais(linhas));
          setStatusEditais('ok');
        } else {
          setEditais([]);
          setStatusEditais('erro');
        }
      }, []);

      const carregarNoticias = useCallback(async () => {
        setStatusNoticias('carregando');
        const linhas = await lerPlanilhaPublicada(CONFIG.PLANILHA_NOTICIAS_URL, (l) => encontrarCabecalhoNoticias(l) !== -1);
        if (linhas) {
          setNoticias(processarNoticias(linhas));
          setStatusNoticias('ok');
        } else {
          setNoticias([]);
          setStatusNoticias('erro');
        }
      }, []);

      useEffect(() => {
        carregarEditais();
        carregarNoticias();
      }, [carregarEditais, carregarNoticias]);



      useEffect(() => {
        const onResize = () => {
          if (window.innerWidth >= 1280) setVisibleCount(4);
          else if (window.innerWidth >= 1024) setVisibleCount(3);
          else if (window.innerWidth >= 768) setVisibleCount(2);
          else setVisibleCount(1);
        };
        onResize();
        window.addEventListener('resize', onResize);
        return () => window.removeEventListener('resize', onResize);
      }, []);

      // ---- Derivados ----
      const carouselNoticias = useMemo(() => noticias.slice(0, 8), [noticias]);
      const ultimasTres = useMemo(() => noticias.slice(0, 3), [noticias]);
      const municipiosNoticias = useMemo(() => Array.from(new Set(noticias.map(n => n.municipio).filter(Boolean))).sort(), [noticias]);
      const categoriasNoticias = useMemo(() => Array.from(new Set(noticias.map(n => n.categoria).filter(Boolean))).sort(), [noticias]);
      const noticiasFiltradas = useMemo(() => noticias.filter(n => {
        const t = normalizar(newsSearch);
        const okBusca = !t || normalizar(`${n.titulo} ${n.resumo} ${n.subtitulo}`).includes(t);
        const okMuni = !newsMunicipio || n.municipio === newsMunicipio;
        const okCat = !newsCategoria || n.categoria === newsCategoria;
        const okDe = !newsDataDe || (n.data && n.data >= newsDataDe);
        const okAte = !newsDataAte || (n.data && n.data <= newsDataAte);
        return okBusca && okMuni && okCat && okDe && okAte;
      }), [noticias, newsSearch, newsMunicipio, newsCategoria, newsDataDe, newsDataAte]);

      const filteredEditais = useMemo(() => editais.filter(ed =>
        (!filtroMuni || ed.municipio === filtroMuni) && (!filtroSit || ed.situacao === filtroSit)
      ), [editais, filtroMuni, filtroSit]);
      const editaisDoRelatorio = useMemo(() => relatorioMunicipio ? editais.filter(ed => ed.municipio === relatorioMunicipio) : [], [editais, relatorioMunicipio]);
      const totalContratadoRelatorio = useMemo(() => editaisDoRelatorio.reduce((acc, ed) => acc + moedaParaNumero(ed.valorContrato), 0), [editaisDoRelatorio]);

      const resultadosBusca = useMemo(() => {
        const t = normalizar(globalSearch);
        if (!t) return { municipios: [], editais: [], noticias: [] };
        return {
          municipios: MUNICIPIOS.filter(m => normalizar(`${m.nome} ${m.nutricionista}`).includes(t)),
          editais: editais.filter(e => normalizar(`${e.numero} ${e.municipio} ${e.escola} ${e.contemplados}`).includes(t)).slice(0, 20),
          noticias: noticias.filter(n => normalizar(`${n.titulo} ${n.resumo} ${n.municipio} ${n.categoria}`).includes(t)).slice(0, 20)
        };
      }, [globalSearch, editais, noticias]);
      const totalResultados = resultadosBusca.municipios.length + resultadosBusca.editais.length + resultadosBusca.noticias.length;

      const totalRepasse = MUNICIPIOS.reduce((acc, m) => acc + (m.valorContratado || 0), 0);
      const totalAgricultores = MUNICIPIOS.reduce((acc, m) => acc + (m.agricultores || 0), 0);
      const totalAlunos = MUNICIPIOS.reduce((acc, m) => acc + (m.alunosRedeMunicipal || 0), 0);

      // ---- Carrossel da Home ----
      const maxSlideIndex = Math.max(0, carouselNoticias.length - visibleCount);
      useEffect(() => { if (activeSlide > maxSlideIndex) setActiveSlide(0); }, [maxSlideIndex]);
      useEffect(() => {
        if (isHovered || view !== 'home' || carouselNoticias.length <= visibleCount) return;
        const it = setInterval(() => setActiveSlide(p => (p >= maxSlideIndex ? 0 : p + 1)), 4000);
        return () => clearInterval(it);
      }, [isHovered, visibleCount, carouselNoticias.length, view, maxSlideIndex]);
      const nextSlide = () => { setActiveSlide(p => (p >= maxSlideIndex ? 0 : p + 1)); anunciar('Próximo slide de notícias'); };
      const prevSlide = () => { setActiveSlide(p => (p <= 0 ? maxSlideIndex : p - 1)); anunciar('Slide anterior de notícias'); };

      useEffect(() => {
        if (isFeaturedHovered || view !== 'noticias' || ultimasTres.length <= 1) return;
        const it = setInterval(() => setFeaturedSlideIndex(p => (p + 1) % ultimasTres.length), 5000);
        return () => clearInterval(it);
      }, [isFeaturedHovered, ultimasTres.length, view]);
      useEffect(() => { if (featuredSlideIndex >= ultimasTres.length) setFeaturedSlideIndex(0); }, [ultimasTres.length]);

      // ---- Estilos ----
      const themeBg = highContrast ? 'bg-black text-white' : 'bg-brand-cream text-brand-charcoal';
      const headerBg = highContrast ? 'bg-zinc-900 border-b border-zinc-700 text-white' : 'bg-brand-primary text-white';
      const footerBg = highContrast ? 'bg-zinc-900 border-t border-zinc-700 text-white' : 'bg-brand-charcoal text-slate-300';
      const cardBg = highContrast ? 'bg-zinc-950 text-white border border-white' : 'bg-white shadow-md border border-brand-light';
      const btnPrimary = highContrast ? 'bg-white text-black font-bold border-2 border-white' : 'bg-brand-brown hover:bg-brand-darkBrown text-white font-bold shadow-md transition-colors';

      const logoUrl = CONFIG.LOGO_DRIVE_ID ? linkImagemDrive(CONFIG.LOGO_DRIVE_ID, 200) : null;

      const navItems = ['home', 'editais', 'municipios', 'biblioteca', 'noticias', 'sobre'];

      return (
        <div className={`min-h-screen flex flex-col font-sans transition-colors duration-200 ${themeBg}`} style={{ fontSize: `${fontSize}px` }}>

          <div className="sr-only" role="status" aria-live="polite">{srMensagem}</div>

          {toast && (
            <div className="fixed bottom-5 right-5 z-[80] bg-brand-charcoal text-white p-4 rounded-xl shadow-2xl border border-brand-green max-w-sm animate-fade-in">
              <div className="flex items-center gap-2">
                <span className={toast.type === 'error' ? 'text-red-400' : 'text-brand-yellow'}>●</span>
                <p className="text-xs font-bold">{toast.message}</p>
              </div>
            </div>
          )}

          {imagemAmpliada && (
            <div className="fixed inset-0 z-[70] bg-black/90 flex items-center justify-center p-4 sm:p-10 cursor-zoom-out" onClick={() => setImagemAmpliada(null)}>
              <button onClick={() => setImagemAmpliada(null)} className="absolute top-4 right-4 sm:top-6 sm:right-6 text-white/80 hover:text-white text-3xl font-bold w-11 h-11 flex items-center justify-center rounded-full hover:bg-white/10" aria-label="Fechar">✕</button>
              <img src={imagemAmpliada} alt="Imagem ampliada" className="max-w-full max-h-full object-contain rounded-lg shadow-2xl cursor-default" onClick={(e) => e.stopPropagation()} />
            </div>
          )}

          {/* ============ CABEÇALHO ============ */}
          <header className={`${headerBg} sticky top-0 z-50 shadow-md transition-colors`}>
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-20">
                <button className="flex items-center gap-3 text-left" onClick={() => irPara('home')} aria-label="Ir para o início">
                  <div className="w-12 h-12 bg-white/10 backdrop-blur-sm rounded-xl flex items-center justify-center p-1 shadow border border-white/20">
                    {logoUrl && !logoErro ? (
                      <img src={logoUrl} alt="Logo Observatório PNAE" className="w-full h-full object-contain" onError={() => setLogoErro(true)} />
                    ) : (
                      <svg viewBox="0 0 100 100" className="w-full h-full" aria-hidden="true">
                        <path d="M50 15C30 15 20 30 20 50C20 70 30 85 50 85C70 85 80 70 80 50C80 30 70 15 50 15ZM45 68L30 53L35 48L45 58L65 38L70 43L45 68Z" fill="#F6C044" />
                      </svg>
                    )}
                  </div>
                  <div>
                    <span className="block text-base sm:text-lg font-extrabold tracking-tight">
                      <span className="text-brand-yellow">OBSERVATÓRIO</span> PNAE
                    </span>
                    <span className="block text-[9px] uppercase tracking-widest text-brand-light">Baixo Sul da Bahia</span>
                  </div>
                </button>

                <nav className="hidden lg:flex items-center space-x-2 font-bold text-base" aria-label="Menu principal">
                  {navItems.map(v => (
                    <button
                      key={v}
                      onClick={() => irPara(v)}
                      aria-current={view === v ? 'page' : undefined}
                      className={`px-3.5 py-2 rounded-lg transition-all duration-300 transform hover:scale-105 hover:-translate-y-0.5 active:scale-95 ${view === v ? 'bg-brand-darkBrown text-brand-yellow shadow-md' : 'hover:bg-brand-darkBrown/60 text-white'}`}
                    >
                      {VIEW_LABELS[v]}
                    </button>
                  ))}
                </nav>

                <button onClick={() => setMobileMenuOpen(!mobileMenuOpen)} className="lg:hidden p-2 rounded-md hover:bg-brand-darkBrown focus:outline-none" aria-label="Abrir menu" aria-expanded={mobileMenuOpen}>
                  <svg className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    {mobileMenuOpen
                      ? <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                      : <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" />}
                  </svg>
                </button>
              </div>
            </div>

            {mobileMenuOpen && (
              <div className="lg:hidden bg-brand-brown border-t border-brand-darkBrown px-4 py-4 space-y-1.5">
                {navItems.map(v => (
                  <button key={v} onClick={() => irPara(v)} className={`block w-full text-left px-3 py-2.5 rounded-lg hover:bg-brand-darkBrown ${view === v ? 'text-brand-yellow font-bold' : 'text-white'}`}>
                    {VIEW_LABELS[v]}
                  </button>
                ))}
              </div>
            )}
          </header>

          <div className="flex-grow flex flex-col min-w-0">

            {/* Barra de acessibilidade */}
            <div className="bg-brand-charcoal text-white text-[11px] py-2 px-4 sm:px-6 lg:px-8 shadow-sm flex flex-wrap justify-between items-center gap-2 shrink-0">
              <div className="flex items-center gap-4">
                <span className="font-bold tracking-wider text-brand-light">Acessibilidade:</span>
                <button onClick={() => setHighContrast(!highContrast)} className="flex items-center gap-1 bg-neutral-700 py-1 px-2 rounded hover:bg-neutral-600">
                  <span className="inline-block w-3 h-3 bg-white border border-black rounded-full"></span>
                  {highContrast ? 'Desativar Alto Contraste' : 'Alto Contraste'}
                </button>
              </div>
              <div className="flex items-center gap-3">

                      <div className="space-y-3">
                        <div className="flex items-start gap-4 p-4 rounded-2xl bg-brand-cream border border-brand-light">

                            <span className="block font-bold text-brand-brown">{CONFIG.TELEFONE_CONTATO}</span>
                          </div>
                        </a>
                        <a href={`mailto:${CONFIG.EMAIL_CONTATO}`} className="flex items-start gap-4 p-4 rounded-2xl bg-brand-cream border border-brand-light hover:border-brand-green transition-colors">
                          <span className="w-10 h-10 rounded-xl bg-brand-green/10 flex items-center justify-center text-lg shrink-0" aria-hidden="true">✉️</span>
                          <div className="text-sm text-brand-charcoal min-w-0">
                            <span className="block text-[11px] font-bold uppercase tracking-wide text-brand-charcoal/60">E-mail</span>
                            <span className="block font-bold text-brand-brown break-all">{CONFIG.EMAIL_CONTATO}</span>
                          </div>

                    </div>

                    <div className="lg:col-span-7 flex flex-col gap-3">
                      <div className="rounded-2xl overflow-hidden border border-brand-light shadow-sm flex-grow min-h-[300px]">
                        <iframe src={`https://www.google.com/maps?q=${CONFIG.MAPS_COORD}&z=17&output=embed`} title="Localização da sede do CIAPRA em Ituberá" className="w-full h-full border-0" style={{ minHeight: '300px' }} loading="lazy" referrerPolicy="no-referrer-when-downgrade"></iframe>
                      </div>
                      <a href={`https://www.google.com/maps?q=${CONFIG.MAPS_COORD}`} target="_blank" rel="noopener noreferrer" className="self-start text-xs font-bold text-brand-primary hover:underline">📍 Abrir no Google Maps →</a>

                  </section>
                </div>

            </main>

            {/* Parceiros */}
            <section className="bg-brand-light/20 border-t border-brand-light py-14 px-4">
              <div className="max-w-5xl mx-auto text-center space-y-8">
                <div>
                  <h2 className="text-xl font-bold text-brand-brown">Parceiros Institucionais</h2>
                  <p className="text-brand-charcoal/70 text-xs mt-1">Instituições que tornam o Observatório uma realidade.</p>
                </div>
                <div className="flex flex-wrap justify-center items-stretch gap-5 sm:gap-6">
                  {[
                    ['https://i.postimg.cc/VNqSB7m6/logo-CAR.png', 'CAR'],
                    ['https://i.postimg.cc/N06y7NB5/logo-instituo-arapyau.png', 'Instituto Arapyaú'],
                    ['https://i.postimg.cc/SK6X7Zkx/logo-PARQUE-CIENTIFICO.png', 'Parque Científico']
                  ].map(([src, nome]) => (
                    <div key={nome} className="bg-white border border-brand-light rounded-2xl shadow-sm hover:shadow-md transition-all p-6 w-44 sm:w-52 h-28 sm:h-32 flex items-center justify-center">

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
