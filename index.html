    const VIEWS = ['home', 'editais', 'municipios', 'biblioteca', 'noticias', 'sobre'];
    const VIEW_LABELS = { home: 'Início', editais: 'Editais', municipios: 'Municípios', biblioteca: 'Biblioteca', noticias: 'Notícias', sobre: 'Sobre a Rede' };

    const PLACEHOLDER_IMG = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      "<svg xmlns='http://www.w3.org/2000/svg' width='800' height='450'><rect width='100%' height='100%' fill='#52291D'/><text x='50%' y='50%' fill='#F6C044' font-family='Arial' font-size='36' font-weight='bold' text-anchor='middle' dominant-baseline='middle'>Observatório PNAE</text></svg>"

    // =====================================================================================
    // FUNÇÕES AUXILIARES
    // =====================================================================================
    const normalizar = (str) => String(str || '')
      .toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, ' ')
      .trim();

    const PALAVRAS_MINUSCULAS = ['de', 'da', 'do', 'das', 'dos', 'e'];
    const toTitleCase = (str) => String(str || '').toLowerCase().split(' ')
      .map((w, i) => (i > 0 && PALAVRAS_MINUSCULAS.includes(w)) ? w : w.charAt(0).toUpperCase() + w.slice(1))
      .join(' ');

    // Converte o nome do município vindo da planilha para o nome padronizado do site
    const nomeMunicipioPadrao = (bruto) => {
      const n = normalizar(bruto);
      const m = MUNICIPIOS.find(mu => normalizar(mu.nome) === n || normalizar(mu.id.replace(/_/g, ' ')) === n);
      return m ? m.nome : toTitleCase(bruto);
    };

    const escapeHtml = (s) => String(s || '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

    // Prepara o conteúdo das notícias: aceita texto simples (com parágrafos) ou HTML,
    // e sempre passa pelo DOMPurify para remover qualquer código malicioso.
    const prepararConteudo = (texto) => {
      if (!texto) return '';
      const temHtml = /<[a-z][\s\S]*>/i.test(texto);
      const temBlocos = /<(p|br|div|ul|ol|h[1-6]|table)\b/i.test(texto);
      const html = temHtml
        ? (temBlocos ? texto : texto.split(/\n{2,}/).map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join(''))
        : texto.split(/\n{2,}/).map(p => `<p>${escapeHtml(p).replace(/\n/g, '<br>')}</p>`).join('');
      if (window.DOMPurify) return window.DOMPurify.sanitize(html, { ADD_ATTR: ['target'] });
      return `<p>${escapeHtml(texto).replace(/\n/g, '<br>')}</p>`;
    };

    // Converte link de compartilhamento do Google Drive em link de imagem que carrega no site
    const linkImagemDrive = (id, largura = 1600) => `https://drive.google.com/thumbnail?id=${id}&sz=w${largura}`;
    const converterLinkDrive = (url) => {
      if (!url) return '';
      const str = String(url).trim();
      const padroes = [
        /drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/,
        /drive\.google\.com\/open\?id=([a-zA-Z0-9_-]+)/,
        /google\.com\/uc\?[^"]*id=([a-zA-Z0-9_-]+)/,
        /drive\.google\.com\/thumbnail\?id=([a-zA-Z0-9_-]+)/
      ];
      for (const p of padroes) {
        const m = str.match(p);
        if (m && m[1]) return linkImagemDrive(m[1]);
      }
      // Força https para não gerar o aviso "Não seguro" no navegador
      return str.replace(/^http:\/\//i, 'https://');
    };

    // ---- Datas ----
    const criarData = (y, m, d) => {
      if (!y || m < 1 || m > 12 || d < 1 || d > 31) return null;
      const dt = new Date(y, m - 1, d);
      return dt.getMonth() === m - 1 ? dt : null;
    };
    const excelSerialToDate = (serial) => {
      const dt = new Date(Math.round((serial - 25569) * 86400 * 1000));
      return new Date(dt.getUTCFullYear(), dt.getUTCMonth(), dt.getUTCDate());
    };
    // Descobre se uma coluna de datas está em DD/MM/AAAA (padrão BR) ou MM/DD/AAAA (padrão EUA),
    // olhando todos os valores da coluna. Na dúvida, assume o padrão brasileiro.
    const detectarOrdemDatas = (valores) => {
      let dmy = 0, mdy = 0;
      valores.forEach(v => {
        const m = String(v || '').trim().match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-]\d{2,4}/);
        if (!m) return;
        if (+m[1] > 12) dmy++;
        else if (+m[2] > 12) mdy++;
      });
      return mdy > dmy ? 'MDY' : 'DMY';
    };
    const parseData = (valor, ordem = 'DMY') => {
      if (valor === null || valor === undefined || valor === '') return null;
      if (typeof valor === 'number') return excelSerialToDate(valor);
      const s = String(valor).trim();
      if (!s) return null;
      let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (m) return criarData(+m[1], +m[2], +m[3]);
      m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);
      if (m) {
        let a = +m[1], b = +m[2], y = +m[3];
        if (y < 100) y += 2000;
        let dia, mes;
        if (a > 12) { dia = a; mes = b; }
        else if (b > 12) { dia = b; mes = a; }
        else if (ordem === 'MDY') { mes = a; dia = b; }
        else { dia = a; mes = b; }
        return criarData(y, mes, dia);
      }
      return null;
    };
    const formatarDataBR = (dt) => dt
      ? `${String(dt.getDate()).padStart(2, '0')}/${String(dt.getMonth() + 1).padStart(2, '0')}/${dt.getFullYear()}`
      : '';
    const paraISO = (dt) => dt
      ? `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`
      : '';
    // Exibe AAAA-MM-DD como DD/MM/AAAA sem erro de fuso horário
    const isoParaBR = (iso) => {
      const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
      return m ? `${m[3]}/${m[2]}/${m[1]}` : (iso || '');
    };

    const situacaoPorData = (dt) => {
      if (!dt) return 'Sem data';
      const hoje = new Date();
      hoje.setHours(0, 0, 0, 0);
      return dt < hoje ? 'Encerrado' : 'Aberto';
    };

    // ---- Valores monetários ----
    const formatarMoeda = (valor) => {
      if (valor === null || valor === undefined || valor === '') return '';
      if (typeof valor === 'number') {
        return isNaN(valor) ? '' : valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
      }
      const s = String(valor).trim();
      if (!s) return '';
      if (s.toUpperCase().includes('R$')) return s;
      if (/^-?\d+([.,]\d+)?$/.test(s)) {
        const n = parseFloat(s.replace(',', '.'));
        if (!isNaN(n)) return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
      }
      return s;
    };
    const moedaParaNumero = (valor) => {
      if (valor === null || valor === undefined || valor === '') return 0;
      if (typeof valor === 'number') return valor;
      const limpo = String(valor).replace(/[^\d,.-]/g, '').replace(/\./g, '').replace(',', '.');
      const n = parseFloat(limpo);
      return isNaN(n) ? 0 : n;
    };

    // ---- Leitura das planilhas ----
    const baixarCSV = (url) => new Promise((resolve, reject) => {
      Papa.parse(url, {
        download: true,
        header: false,
        skipEmptyLines: false,
        complete: (r) => resolve(r.data || []),
        error: (err) => reject(err)
      });
    });
    // Converte o link publicado (pubhtml) em link de CSV
    const urlCSVPublicado = (url) => {
      const u = String(url || '').trim();
      if (!u) return '';
      if (/output=csv/.test(u)) return u;
      const base = u.replace('/pubhtml', '/pub').replace(/[?#].*$/, '');
      const gid = (u.match(/[?&]gid=(\d+)/) || [])[1] || '0';
      return `${base}?gid=${gid}&single=true&output=csv`;
    };
    const lerPlanilhaPublicada = async (url, validar) => {
      const csv = urlCSVPublicado(url);
      // Parâmetro extra evita que o navegador mostre uma cópia antiga em cache
      const comCache = csv + `&t=${Math.floor(Date.now() / 60000)}`;
      for (const tentativa of [comCache, csv]) {
        try {
          const linhas = await baixarCSV(tentativa);
          if (validar(linhas)) return linhas;
        } catch (e) {
          console.warn('[Observatório PNAE] Falha ao ler a planilha publicada', e);
        }
      }
      return null;
    };

    // ---- Editais ----
    const encontrarCabecalhoEditais = (linhas) => {
      for (let i = 0; i < Math.min(10, linhas.length); i++) {
        const norm = (linhas[i] || []).map(normalizar);
        if (norm.some(c => c.includes('municipio')) && norm.some(c => c.includes('edital') && !c.includes('valor'))) return i;
      }
      return -1;
    };
    const mapearColunasEditais = (cab) => {
      const n = (cab || []).map(normalizar);
      const idx = (f) => n.findIndex(f);
      return {
        municipio: idx(h => h.includes('municipio')),
        escola: idx(h => h.includes('escola')),
        numeroEdital: idx(h => h.includes('edital') && !h.includes('valor') && !ehColunaLink(h)),
        linkEdital: idx(h => ehColunaLink(h)),
        dataLancamento: idx(h => h.includes('lancamento')),
        dataFechamento: idx(h => h.includes('fechamento')),
        vigencia: idx(h => h.includes('vigencia')),
        valorEdital: idx(h => h.includes('valor') && h.includes('edital')),
        contemplados: idx(h => h.includes('contempl')),
        numeroContrato: idx(h => h.includes('contrato') && !h.includes('valor') && !ehColunaLink(h)),
        valorContrato: idx(h => h.includes('valor') && h.includes('contrato')),
        familiasBeneficiadas: idx(h => h.includes('familia')),
        alunosBeneficiados: idx(h => h.includes('aluno'))
      };
    };
    // Coluna com o link do edital completo (ex.: "LINK DO EDITAL", "URL", "EDITAL COMPLETO")
    const ehColunaLink = (h) => h.includes('link') || h.includes('url') || h.includes('completo');
    const normalizarLink = (bruto) => {
      const s = String(bruto || '').trim();
      if (/^https?:\/\//i.test(s)) return s.replace(/^http:\/\//i, 'https://');
      if (/^(www\.|drive\.|docs\.)/i.test(s)) return 'https://' + s;
      return '';
    };
    const IGNORAR_MUNICIPIO = ['estado da bahia', 'total', 'municipios'];
    const processarEditais = (linhas) => {
      const iCab = encontrarCabecalhoEditais(linhas);
      if (iCab === -1) return [];
      const col = mapearColunasEditais(linhas[iCab]);
      const dados = linhas.slice(iCab + 1);
      const ordemLanc = col.dataLancamento >= 0 ? detectarOrdemDatas(dados.map(r => r[col.dataLancamento])) : 'DMY';
      const ordemFech = col.dataFechamento >= 0 ? detectarOrdemDatas(dados.map(r => r[col.dataFechamento])) : 'DMY';
      const lista = [];
      dados.forEach((row, i) => {
        const get = (k) => (col[k] >= 0 ? String(row[col[k]] ?? '').trim() : '');
        const municipioBruto = get('municipio');
        const numero = get('numeroEdital');
        if (!municipioBruto || !numero) return;
        if (IGNORAR_MUNICIPIO.includes(normalizar(municipioBruto))) return;
        const dtLanc = col.dataLancamento >= 0 ? parseData(row[col.dataLancamento], ordemLanc) : null;
        const dtFech = col.dataFechamento >= 0 ? parseData(row[col.dataFechamento], ordemFech) : null;
        const valorEdital = formatarMoeda(get('valorEdital'));
        const valorContrato = formatarMoeda(get('valorContrato'));
        const ano = (numero.match(/(\d{4})/) || [])[1] || (dtFech ? String(dtFech.getFullYear()) : '');
        lista.push({
          id: `edital-${iCab + 1 + i}`,
          municipio: nomeMunicipioPadrao(municipioBruto),
          escola: get('escola'),
          numero: /chamada/i.test(numero) ? numero : `Chamada Pública nº ${numero}`,
          dataLancamento: formatarDataBR(dtLanc),
          data: formatarDataBR(dtFech) || 'Não informada',
          dataFechamentoObj: dtFech,
          vigencia: get('vigencia') || '—',
          valorEdital,
          contemplados: get('contemplados'),
          numeroContrato: get('numeroContrato'),
          valorContrato: valorContrato || valorEdital || 'A definir',
          familiasBeneficiadas: get('familiasBeneficiadas'),
          alunosBeneficiados: get('alunosBeneficiados'),
          situacao: situacaoPorData(dtFech),
          linkEdital: normalizarLink(get('linkEdital')),
          ano
        });
      });
      // Mais recentes primeiro
      return lista.sort((a, b) => (b.dataFechamentoObj?.getTime() || 0) - (a.dataFechamentoObj?.getTime() || 0));
    };

    // ---- Notícias ----
    const encontrarCabecalhoNoticias = (linhas) => {
      for (let i = 0; i < Math.min(10, linhas.length); i++) {
        if ((linhas[i] || []).map(normalizar).some(c => c.includes('titulo') && !c.includes('sub'))) return i;
      }
      return -1;
    };
    const mapearColunasNoticias = (cab) => {
      const n = (cab || []).map(normalizar);
      const idx = (f) => n.findIndex(f);
      return {
        titulo: idx(h => h.includes('titulo') && !h.includes('sub')),
        subtitulo: idx(h => h.includes('subtitulo')),
        resumo: idx(h => h.includes('resumo')),
        conteudo: idx(h => h.includes('conteudo')),
        categoria: idx(h => h.includes('categoria') || h.includes('assunto')),
        municipio: idx(h => h.includes('municipio')),
        autor: idx(h => h.includes('autor')),
        data: idx(h => h.includes('data')),
        status: idx(h => h.includes('status')),
        imagem: idx(h => h.includes('imagem') && !h.includes('galeria')),
        galeria: idx(h => h.includes('galeria'))
      };
    };
    const processarNoticias = (linhas) => {
      const iCab = encontrarCabecalhoNoticias(linhas);
      if (iCab === -1) return [];
      const col = mapearColunasNoticias(linhas[iCab]);
      const dados = linhas.slice(iCab + 1);
      const ordem = col.data >= 0 ? detectarOrdemDatas(dados.map(r => r[col.data])) : 'DMY';
      const lista = [];
      dados.forEach((row, i) => {
        const get = (k) => (col[k] >= 0 ? String(row[col[k]] ?? '').trim() : '');
        const titulo = get('titulo');
        if (!titulo) return;
        const status = normalizar(get('status'));
        if (status === 'rascunho' || status === 'despublicada' || status === 'oculta') return;
        const dt = col.data >= 0 ? parseData(row[col.data], ordem) : null;
        const galeria = get('galeria')
          ? get('galeria').split(/[,\n]/).map(s => converterLinkDrive(s.trim())).filter(Boolean)
          : [];
        lista.push({
          id: `noticia-${iCab + 1 + i}`,
          titulo,
          subtitulo: get('subtitulo'),
          resumo: get('resumo'),
          conteudo: get('conteudo'),
          categoria: get('categoria') || 'Notícia',
          municipio: get('municipio') || 'Regional / Baixo Sul',
          autor: get('autor') || 'Comunicação CIAPRA',
          data: paraISO(dt),
          imagem: converterLinkDrive(get('imagem')),
          galeria
        });
      });
      return lista.sort((a, b) => (b.data || '').localeCompare(a.data || ''));
    };

    const formatarTamanho = (bytes) => {
      const b = parseInt(bytes, 10);
      if (!b || isNaN(b)) return '';
      if (b < 1024) return `${b} B`;
      if (b < 1024 * 1024) return `${(b / 1024).toFixed(0)} KB`;
      return `${(b / (1024 * 1024)).toFixed(1)} MB`;
    };
    const iconeArquivo = (mime) => {
      if (!mime) return '📄';
      if (mime.includes('pdf')) return '📕';
      if (mime.includes('spreadsheet')) return '📊';
      if (mime.includes('document')) return '📘';
      if (mime.includes('presentation')) return '📙';
      if (mime.includes('image')) return '🖼️';
      if (mime.includes('folder')) return '📁';
      return '📄';
    };

    // Imagem com troca automática para um marcador visual caso o link quebre
    function Img({ src, alt, className, fallback = PLACEHOLDER_IMG, ...rest }) {
      const [erro, setErro] = useState(false);
      useEffect(() => setErro(false), [src]);
      return (
        <img
          src={!src || erro ? fallback : src}
          alt={alt}
          className={className}
          loading="lazy"
          onError={() => setErro(true)}
          {...rest}
        />
      );
    }

    function EstadoVazio({ status, vazio, erro }) { return (
      <div className="col-span-full text-center py-12 text-brand-charcoal/60 text-sm">
        {status === 'carregando' && (
          <span className="inline-flex items-center gap-2">
            <span className="w-2 h-2 rounded-full bg-brand-yellow animate-pulse inline-block"></span>
            Carregando dados...
          </span>
        )}
        {status === 'erro' && <span>{erro}</span>}
        {status === 'ok' && <span>{vazio}</span>}
      </div>
    ); }

    function CardNoticia({ item, onOpen }) { return (
      <div className="bg-white rounded-2xl overflow-hidden border border-brand-light/60 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 flex flex-col h-full">
        <div className="h-44 relative overflow-hidden shrink-0">
          <Img src={item.imagem} alt={item.titulo} className="w-full h-full object-cover" />
          <span className="absolute top-3 left-3 bg-brand-primary text-brand-yellow font-extrabold text-[10px] px-2.5 py-1 rounded-full uppercase tracking-wider shadow">
            {item.categoria}
          </span>
        </div>
        <div className="p-5 flex-grow flex flex-col justify-between">
          <div className="space-y-2">
            <div className="flex items-center justify-between gap-2">
              <span className="text-[10px] text-brand-charcoal/50 font-bold">{isoParaBR(item.data)}</span>
              <span className="text-[10px] text-brand-green font-bold truncate">📍 {item.municipio}</span>
            </div>
            <h3 className="text-base font-extrabold text-brand-brown leading-snug line-clamp-2">{item.titulo}</h3>
            <p className="text-xs text-brand-charcoal/75 leading-relaxed line-clamp-3">{item.resumo}</p>
          </div>
          <div className="pt-4 mt-4 border-t border-brand-light/50">
            <button
              onClick={() => onOpen(item)}
              className="w-full py-2 bg-brand-cream hover:bg-brand-brown hover:text-white text-brand-brown font-extrabold rounded-xl text-xs tracking-wider transition-all duration-300 shadow-sm"
            >
              Leia mais →
            </button>
          </div>
        </div>
      </div>
    ); }

    // ---- Visualização de dados ----
    const moedaCompacta = (v) => {
      if (!v && v !== 0) return '';
      if (Math.abs(v) >= 1e6) return `R$ ${(v / 1e6).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 })} mi`;
      if (Math.abs(v) >= 1e4) return `R$ ${Math.round(v / 1e3).toLocaleString('pt-BR')} mil`;
      return `R$ ${Math.round(v).toLocaleString('pt-BR')}`;
    };

    function LinkEdital({ href, compacto }) {
      if (!href) return null;
      return (
        <a
          href={href}
          target="_blank"
          rel="noopener noreferrer"
          onClick={(e) => e.stopPropagation()}
          title="Abrir o edital completo em nova aba"
          aria-label="Abrir o edital completo em nova aba"
          className={compacto
            ? 'inline-flex items-center gap-1 h-9 px-3 rounded-lg border border-brand-green/50 text-brand-darkGreen hover:bg-brand-green/10 text-xs font-extrabold transition-colors whitespace-nowrap'
            : 'inline-flex items-center gap-1.5 px-4 py-2 rounded-lg bg-brand-green/10 text-brand-darkGreen hover:bg-brand-green/20 text-xs font-extrabold transition-colors'}
        >
          {compacto ? 'Edital' : 'Edital completo'}<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M14 3h7v7"/><path d="M10 14 21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg>
        </a>
      );
    }

    function IndicadorTile({ cor, icone, rotulo, valor, nota }) {
      return (
        <div className="bg-white rounded-2xl border border-brand-light shadow-sm hover:shadow-md transition-shadow p-5 flex gap-4 items-start relative overflow-hidden">
          <span className="absolute left-0 top-0 bottom-0 w-1.5" style={{ backgroundColor: cor }} aria-hidden="true"></span>
          <span className="w-11 h-11 rounded-xl flex items-center justify-center text-xl shrink-0" style={{ backgroundColor: cor + '1A' }} aria-hidden="true">{icone}</span>
          <div className="min-w-0">
            <span className="block text-xs font-bold text-brand-charcoal/70">{rotulo}</span>
            <span className="block text-3xl font-black text-brand-brown leading-tight mt-1 whitespace-nowrap">{valor}</span>
            <span className="block text-[11px] text-brand-charcoal/55 mt-1 leading-snug">{nota}</span>
          </div>
        </div>
      );
    }

    const METRICAS_COMPARATIVO = [
      { key: 'valorContratado', rotulo: 'Repasse PNAE 2025', valor: (m) => m.valorContratado, fmt: (v) => moedaCompacta(v), fonte: 'FNDE, liberações do PNAE 2025' },
      { key: 'porAluno', rotulo: 'Repasse por aluno', valor: (m) => m.valorContratado / m.alunosRedeMunicipal, fmt: (v) => moedaCompacta(v), fonte: 'Repasse FNDE 2025 ÷ matrículas da rede municipal (Inep 2025)' },
      { key: 'alunosRedeMunicipal', rotulo: 'Alunos', valor: (m) => m.alunosRedeMunicipal, fmt: (v) => v.toLocaleString('pt-BR'), fonte: 'Inep, Sinopse Estatística da Educação Básica 2025' },
      { key: 'agricultores', rotulo: 'Agricultores (CAF)', valor: (m) => m.agricultores, fmt: (v) => v.toLocaleString('pt-BR'), fonte: 'MDA, Cadastro Nacional da Agricultura Familiar, jun/2026' },
      { key: 'meta30Porcento', rotulo: '% na agricultura familiar', valor: (m) => m.meta30Porcento, fmt: (v) => `${v}%`, referencias: [30, 45], escalaMin: 50, fonte: 'Percentual declarado pelas prefeituras, consolidado pelo CIAPRA. Linhas: mínimo legal de 30% (até 2025) e 45% (desde 2026)' }
    ];

    function ComparativoMunicipios({ onSelect }) {
      const [metricaKey, setMetricaKey] = useState('valorContratado');
      const [hover, setHover] = useState(null);
      const [verTabela, setVerTabela] = useState(false);
      const metrica = METRICAS_COMPARATIVO.find(x => x.key === metricaKey);
      const linhas = useMemo(() => MUNICIPIOS
        .map(m => ({ m, v: metrica.valor(m) }))
        .sort((a, b) => b.v - a.v), [metricaKey]);
      const max = Math.max(metrica.escalaMin || 0, ...linhas.map(l => l.v));
      const pct = (v) => `${Math.max(0, (v / max) * 100)}%`;

      return (
        <div className="bg-white rounded-2xl border border-brand-light shadow-sm p-5 sm:p-7">
          <div className="flex flex-col md:flex-row md:items-end md:justify-between gap-4 mb-5">
            <div>
              <h2 className="text-xl font-black text-brand-brown tracking-tight">Comparativo entre municípios</h2>
              <p className="text-sm text-brand-charcoal/70 mt-1">{metrica.rotulo}, do maior para o menor. Passe o mouse para ver todos os dados; clique para abrir a ficha.</p>
            </div>
            <button onClick={() => setVerTabela(!verTabela)} className="self-start md:self-auto text-xs font-bold text-brand-primary border border-brand-light rounded-lg px-3 py-2 hover:bg-brand-cream">
              {verTabela ? '📊 Ver gráfico' : '📋 Ver tabela'}
            </button>
          </div>

          <div className="flex flex-wrap gap-2 mb-6" role="tablist" aria-label="Escolha o indicador">
            {METRICAS_COMPARATIVO.map(x => (
              <button
                key={x.key}
                role="tab"
                aria-selected={x.key === metricaKey}
                onClick={() => setMetricaKey(x.key)}
                className={`text-xs font-bold px-3 py-2 rounded-full border transition-colors ${x.key === metricaKey ? 'bg-brand-brown text-white border-brand-brown' : 'bg-white text-brand-charcoal border-brand-light hover:border-brand-brown/40'}`}
              >
                {x.rotulo}
              </button>
            ))}
          </div>

          {verTabela ? (
            <div className="overflow-x-auto">
              <table className="w-full text-sm text-left">
                <thead>
                  <tr className="text-[11px] uppercase tracking-wide text-brand-charcoal/60 border-b border-brand-light">
                    <th className="py-2 pr-3">Município</th>
                    {METRICAS_COMPARATIVO.map(x => <th key={x.key} className="py-2 px-3 text-right">{x.rotulo}</th>)}
                  </tr>
                </thead>
                <tbody>
                  {linhas.map(({ m }) => (
                    <tr key={m.id} className="border-b border-brand-light/60 hover:bg-brand-cream cursor-pointer" onClick={() => onSelect(m)}>
                      <td className="py-2 pr-3 font-bold text-brand-brown">{m.nome}</td>
                      {METRICAS_COMPARATIVO.map(x => <td key={x.key} className="py-2 px-3 text-right tabular-nums text-brand-charcoal">{x.fmt(x.valor(m))}</td>)}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          ) : (
            <div className="space-y-0.5" role="list">
              {metrica.referencias && (
                <div className="grid grid-cols-[7.5rem_1fr_4.5rem] sm:grid-cols-[10rem_1fr_5.5rem] gap-3 h-5 text-[10px] font-bold text-brand-charcoal/60">
                  <span></span>
                  <div className="relative">
                    {metrica.referencias.map(r => (
                      <span key={r} className="absolute -translate-x-1/2 bottom-0" style={{ left: pct(r) }}>mín. {r}%</span>
                    ))}
                  </div>
                  <span></span>
                </div>
              )}
              {linhas.map(({ m, v }) => {
                const ativo = hover === m.id;
                return (
                  <button
                    key={m.id}
                    role="listitem"
                    onClick={() => onSelect(m)}
                    onMouseEnter={() => setHover(m.id)}
                    onMouseLeave={() => setHover(null)}
                    onFocus={() => setHover(m.id)}
                    onBlur={() => setHover(null)}
                    aria-label={`${m.nome}: ${metrica.fmt(v)}`}
                    className="relative w-full grid grid-cols-[7.5rem_1fr_4.5rem] sm:grid-cols-[10rem_1fr_5.5rem] gap-3 items-center py-1.5 rounded-lg hover:bg-brand-cream focus:outline-none focus:ring-2 focus:ring-brand-yellow text-left"
                  >
                    <span className={`text-xs truncate ${ativo ? 'font-black text-brand-brown' : 'font-semibold text-brand-charcoal'}`}>{m.nome}</span>
                    <span className="relative h-4 border-l border-brand-charcoal/30">
                      {(metrica.referencias || []).map(r => (
                        <span key={r} className="absolute top-[-6px] bottom-[-6px] border-l border-dashed border-brand-charcoal/50" style={{ left: pct(r) }} aria-hidden="true"></span>
                      ))}
                      <span
                        className="absolute left-0 top-0 h-full rounded-r-[4px] transition-all duration-500"
                        style={{ width: pct(v), backgroundColor: ativo ? '#52291D' : '#327025' }}
                      ></span>
                      {ativo && (
                        <span className="hidden sm:block absolute z-30 top-1/2 -translate-y-1/2 bg-brand-charcoal text-white rounded-xl shadow-xl p-3 w-60 pointer-events-none text-left" role="tooltip" style={(v / max) > 0.55 ? { right: `calc(${100 - (v / max) * 100}% + 10px)` } : { left: `calc(${pct(v)} + 10px)` }}>
                          <span className="block text-sm font-black text-brand-yellow mb-1">{m.nome}</span>
                          {METRICAS_COMPARATIVO.map(x => (
                            <span key={x.key} className={`flex justify-between gap-3 text-[11px] ${x.key === metricaKey ? 'font-black' : 'text-white/80'}`}>
                              <span>{x.rotulo}</span><span className="tabular-nums">{x.fmt(x.valor(m))}</span>
                            </span>
                          ))}
                        </span>
                      )}
                    </span>
                    <span className="text-xs font-bold text-brand-charcoal text-right tabular-nums">{metrica.fmt(v)}</span>

                  </button>
                );
              })}
            </div>
          )}
          <p className="text-[10px] text-brand-charcoal/55 mt-4">Fonte: {metrica.fonte}.</p>
        </div>
      );
    }

    const viewFromHash = () => {
      const h = window.location.hash.replace('#', '').split('/')[0];
      return VIEWS.includes(h) ? h : 'home';
    };

    // =====================================================================================
    // APLICAÇÃO
    // =====================================================================================
    function App() {
      const [view, setView] = useState(viewFromHash);
      const [selectedMunicipio, setSelectedMunicipio] = useState(null);
      const [selectedNoticia, setSelectedNoticia] = useState(null);
      const [relatorioMunicipio, setRelatorioMunicipio] = useState(null);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [toast, setToast] = useState(null);

      // Acessibilidade
      const [fontSize, setFontSize] = useState(16);
      const [highContrast, setHighContrast] = useState(false);
      const [srMensagem, setSrMensagem] = useState('');

      // Busca e filtros
      const [globalSearch, setGlobalSearch] = useState('');
      const [filtroMuni, setFiltroMuni] = useState('');
      const [filtroSit, setFiltroSit] = useState('');
      const [visualizacaoEditais, setVisualizacaoEditais] = useState('cards');

      // Dados das planilhas
      const [editais, setEditais] = useState([]);
      const [statusEditais, setStatusEditais] = useState('carregando'); // carregando | ok | erro
      const [noticias, setNoticias] = useState([]);
      const [statusNoticias, setStatusNoticias] = useState('carregando');

      // Biblioteca
      const [bibliotecaArquivos, setBibliotecaArquivos] = useState([]);
      const [isLoadingBiblioteca, setIsLoadingBiblioteca] = useState(false);
      const [bibliotecaErro, setBibliotecaErro] = useState(false);
      const [bibliotecaBusca, setBibliotecaBusca] = useState('');
      const [bibliotecaPilha, setBibliotecaPilha] = useState([]);
      const [previewFile, setPreviewFile] = useState(null);

      const [imagemAmpliada, setImagemAmpliada] = useState(null);
      const [mostrarDetalhamentoFNDE, setMostrarDetalhamentoFNDE] = useState(false);
      const [logoErro, setLogoErro] = useState(false);

      // Carrosséis
      const [activeSlide, setActiveSlide] = useState(0);
      const [isHovered, setIsHovered] = useState(false);
      const [visibleCount, setVisibleCount] = useState(4);
      const [featuredSlideIndex, setFeaturedSlideIndex] = useState(0);
      const [isFeaturedHovered, setIsFeaturedHovered] = useState(false);

      // Filtros públicos de notícias
      const [newsSearch, setNewsSearch] = useState('');
      const [newsMunicipio, setNewsMunicipio] = useState('');
      const [newsCategoria, setNewsCategoria] = useState('');
      const [newsDataDe, setNewsDataDe] = useState('');
      const [newsDataAte, setNewsDataAte] = useState('');


      const triggerToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4000);
      };
      const anunciar = (msg) => {
        setSrMensagem(msg);
        setTimeout(() => setSrMensagem(''), 3000);
      };

      // ---- Navegação (cada seção tem endereço próprio, ex: /#editais, e o botão Voltar funciona) ----
      const limparSelecoes = () => {
        setSelectedMunicipio(null);
        setSelectedNoticia(null);
        setRelatorioMunicipio(null);
        setMobileMenuOpen(false);
        setGlobalSearch('');
      };
      const irPara = (v) => {
        limparSelecoes();
        setView(v);
        const novoHash = v === 'home' ? '' : '#' + v;
        if (window.location.hash !== novoHash) {
          window.history.pushState(null, '', novoHash || window.location.pathname);
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
      useEffect(() => {
        const onPop = () => { limparSelecoes(); setView(viewFromHash()); };
        window.addEventListener('popstate', onPop);
        return () => window.removeEventListener('popstate', onPop);
      }, []);

      const abrirNoticia = (item) => {
        irPara('noticias');
        setSelectedNoticia(item);
      };

      // ---- Carregamento das planilhas ----
      const carregarEditais = useCallback(async () => {
        setStatusEditais('carregando');
        const linhas = await lerPlanilhaPublicada(CONFIG.PLANILHA_EDITAIS_URL, (l) => processarEditais(l).length > 0);
        if (linhas) {
          setEditais(processarEditais(linhas));
          setStatusEditais('ok');
        } else {
          setEditais([]);
          setStatusEditais('erro');
        }
      }, []);

      const carregarNoticias = useCallback(async () => {
        setStatusNoticias('carregando');
        const linhas = await lerPlanilhaPublicada(CONFIG.PLANILHA_NOTICIAS_URL, (l) => encontrarCabecalhoNoticias(l) !== -1);
        if (linhas) {
          setNoticias(processarNoticias(linhas));
          setStatusNoticias('ok');
        } else {
          setNoticias([]);
          setStatusNoticias('erro');
        }
      }, []);

      useEffect(() => {
        carregarEditais();
        carregarNoticias();
      }, [carregarEditais, carregarNoticias]);

      // ---- Biblioteca (pasta do Google Drive) ----
      const fetchBiblioteca = (folderId) => {
        if (!CONFIG.DRIVE_API_KEY) return;
        setIsLoadingBiblioteca(true);
        setBibliotecaErro(false);
        const params = new URLSearchParams({
          q: `'${folderId}' in parents and trashed = false`,
          key: CONFIG.DRIVE_API_KEY,
          fields: 'files(id,name,mimeType,size)',
          orderBy: 'folder,name',
          pageSize: '200',
          includeItemsFromAllDrives: 'true',
          supportsAllDrives: 'true'
        });
        fetch(`https://www.googleapis.com/drive/v3/files?${params.toString()}`)
          .then(res => res.json())
          .then(data => {
            if (data.files) setBibliotecaArquivos(data.files);
            else {
              console.error('[Observatório PNAE] Erro da API do Drive:', data.error || data);
              setBibliotecaErro(true);
            }
          })
          .catch(err => {
            console.error('[Observatório PNAE] Erro ao listar a Biblioteca:', err);
            setBibliotecaErro(true);
          })
          .finally(() => setIsLoadingBiblioteca(false));
      };
      const entrarNaPasta = (pasta) => {
        setBibliotecaPilha(prev => [...prev, { id: pasta.id, name: pasta.name }]);
        setBibliotecaBusca('');
        setBibliotecaArquivos([]);
        fetchBiblioteca(pasta.id);
      };
      const voltarParaPasta = (index) => {
        const nova = bibliotecaPilha.slice(0, index + 1);
        setBibliotecaPilha(nova);
        setBibliotecaBusca('');
        setBibliotecaArquivos([]);
        fetchBiblioteca(nova[nova.length - 1].id);
      };
      useEffect(() => {
        if (view === 'biblioteca' && CONFIG.DRIVE_API_KEY && bibliotecaPilha.length === 0) {
          setBibliotecaPilha([{ id: CONFIG.PASTA_BIBLIOTECA_ID, name: 'Biblioteca' }]);
          fetchBiblioteca(CONFIG.PASTA_BIBLIOTECA_ID);
        }
      }, [view]);
      const bibliotecaFiltrada = useMemo(() => {
        const t = bibliotecaBusca.trim().toLowerCase();
        return t ? bibliotecaArquivos.filter(f => f.name.toLowerCase().includes(t)) : bibliotecaArquivos;
      }, [bibliotecaArquivos, bibliotecaBusca]);

      useEffect(() => { setMostrarDetalhamentoFNDE(false); }, [selectedMunicipio]);

      useEffect(() => {
        const onResize = () => {
          if (window.innerWidth >= 1280) setVisibleCount(4);
          else if (window.innerWidth >= 1024) setVisibleCount(3);
          else if (window.innerWidth >= 768) setVisibleCount(2);
          else setVisibleCount(1);
        };
        onResize();
        window.addEventListener('resize', onResize);
        return () => window.removeEventListener('resize', onResize);
      }, []);

      // ---- Derivados ----
      const carouselNoticias = useMemo(() => noticias.slice(0, 8), [noticias]);
      const ultimasTres = useMemo(() => noticias.slice(0, 3), [noticias]);
      const municipiosNoticias = useMemo(() => Array.from(new Set(noticias.map(n => n.municipio).filter(Boolean))).sort(), [noticias]);
      const categoriasNoticias = useMemo(() => Array.from(new Set(noticias.map(n => n.categoria).filter(Boolean))).sort(), [noticias]);
      const noticiasFiltradas = useMemo(() => noticias.filter(n => {
        const t = normalizar(newsSearch);
        const okBusca = !t || normalizar(`${n.titulo} ${n.resumo} ${n.subtitulo}`).includes(t);
        const okMuni = !newsMunicipio || n.municipio === newsMunicipio;
        const okCat = !newsCategoria || n.categoria === newsCategoria;
        const okDe = !newsDataDe || (n.data && n.data >= newsDataDe);
        const okAte = !newsDataAte || (n.data && n.data <= newsDataAte);
        return okBusca && okMuni && okCat && okDe && okAte;
      }), [noticias, newsSearch, newsMunicipio, newsCategoria, newsDataDe, newsDataAte]);

      const filteredEditais = useMemo(() => editais.filter(ed =>
        (!filtroMuni || ed.municipio === filtroMuni) && (!filtroSit || ed.situacao === filtroSit)
      ), [editais, filtroMuni, filtroSit]);
      const editaisDoRelatorio = useMemo(() => relatorioMunicipio ? editais.filter(ed => ed.municipio === relatorioMunicipio) : [], [editais, relatorioMunicipio]);
      const totalContratadoRelatorio = useMemo(() => editaisDoRelatorio.reduce((acc, ed) => acc + moedaParaNumero(ed.valorContrato), 0), [editaisDoRelatorio]);

      const resultadosBusca = useMemo(() => {
        const t = normalizar(globalSearch);
        if (!t) return { municipios: [], editais: [], noticias: [] };
        return {
          municipios: MUNICIPIOS.filter(m => normalizar(`${m.nome} ${m.nutricionista}`).includes(t)),
          editais: editais.filter(e => normalizar(`${e.numero} ${e.municipio} ${e.escola} ${e.contemplados}`).includes(t)).slice(0, 20),
          noticias: noticias.filter(n => normalizar(`${n.titulo} ${n.resumo} ${n.municipio} ${n.categoria}`).includes(t)).slice(0, 20)
        };
      }, [globalSearch, editais, noticias]);
      const totalResultados = resultadosBusca.municipios.length + resultadosBusca.editais.length + resultadosBusca.noticias.length;

      const totalRepasse = MUNICIPIOS.reduce((acc, m) => acc + (m.valorContratado || 0), 0);
      const totalAgricultores = MUNICIPIOS.reduce((acc, m) => acc + (m.agricultores || 0), 0);
      const totalAlunos = MUNICIPIOS.reduce((acc, m) => acc + (m.alunosRedeMunicipal || 0), 0);

      // ---- Carrossel da Home ----
      const maxSlideIndex = Math.max(0, carouselNoticias.length - visibleCount);
      useEffect(() => { if (activeSlide > maxSlideIndex) setActiveSlide(0); }, [maxSlideIndex]);
      useEffect(() => {
        if (isHovered || view !== 'home' || carouselNoticias.length <= visibleCount) return;
        const it = setInterval(() => setActiveSlide(p => (p >= maxSlideIndex ? 0 : p + 1)), 4000);
        return () => clearInterval(it);
      }, [isHovered, visibleCount, carouselNoticias.length, view, maxSlideIndex]);
      const nextSlide = () => { setActiveSlide(p => (p >= maxSlideIndex ? 0 : p + 1)); anunciar('Próximo slide de notícias'); };
      const prevSlide = () => { setActiveSlide(p => (p <= 0 ? maxSlideIndex : p - 1)); anunciar('Slide anterior de notícias'); };

      useEffect(() => {
        if (isFeaturedHovered || view !== 'noticias' || ultimasTres.length <= 1) return;
        const it = setInterval(() => setFeaturedSlideIndex(p => (p + 1) % ultimasTres.length), 5000);
        return () => clearInterval(it);
      }, [isFeaturedHovered, ultimasTres.length, view]);
      useEffect(() => { if (featuredSlideIndex >= ultimasTres.length) setFeaturedSlideIndex(0); }, [ultimasTres.length]);

      // ---- Estilos ----
      const themeBg = highContrast ? 'bg-black text-white' : 'bg-brand-cream text-brand-charcoal';
      const headerBg = highContrast ? 'bg-zinc-900 border-b border-zinc-700 text-white' : 'bg-brand-primary text-white';
      const footerBg = highContrast ? 'bg-zinc-900 border-t border-zinc-700 text-white' : 'bg-brand-charcoal text-slate-300';
      const cardBg = highContrast ? 'bg-zinc-950 text-white border border-white' : 'bg-white shadow-md border border-brand-light';
      const btnPrimary = highContrast ? 'bg-white text-black font-bold border-2 border-white' : 'bg-brand-brown hover:bg-brand-darkBrown text-white font-bold shadow-md transition-colors';

      const logoUrl = CONFIG.LOGO_DRIVE_ID ? linkImagemDrive(CONFIG.LOGO_DRIVE_ID, 200) : null;

      const navItems = ['home', 'editais', 'municipios', 'biblioteca', 'noticias', 'sobre'];

      return (
        <div className={`min-h-screen flex flex-col font-sans transition-colors duration-200 ${themeBg}`} style={{ fontSize: `${fontSize}px` }}>

          <div className="sr-only" role="status" aria-live="polite">{srMensagem}</div>

          {toast && (
            <div className="fixed bottom-5 right-5 z-[80] bg-brand-charcoal text-white p-4 rounded-xl shadow-2xl border border-brand-green max-w-sm animate-fade-in">
              <div className="flex items-center gap-2">
                <span className={toast.type === 'error' ? 'text-red-400' : 'text-brand-yellow'}>●</span>
                <p className="text-xs font-bold">{toast.message}</p>
              </div>
            </div>
          )}

          {imagemAmpliada && (
            <div className="fixed inset-0 z-[70] bg-black/90 flex items-center justify-center p-4 sm:p-10 cursor-zoom-out" onClick={() => setImagemAmpliada(null)}>
              <button onClick={() => setImagemAmpliada(null)} className="absolute top-4 right-4 sm:top-6 sm:right-6 text-white/80 hover:text-white text-3xl font-bold w-11 h-11 flex items-center justify-center rounded-full hover:bg-white/10" aria-label="Fechar">✕</button>
              <img src={imagemAmpliada} alt="Imagem ampliada" className="max-w-full max-h-full object-contain rounded-lg shadow-2xl cursor-default" onClick={(e) => e.stopPropagation()} />
            </div>
          )}

          {/* ============ CABEÇALHO ============ */}
          <header className={`${headerBg} sticky top-0 z-50 shadow-md transition-colors`}>
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-20">
                <button className="flex items-center gap-3 text-left" onClick={() => irPara('home')} aria-label="Ir para o início">
                  <div className="w-12 h-12 bg-white/10 backdrop-blur-sm rounded-xl flex items-center justify-center p-1 shadow border border-white/20">
                    {logoUrl && !logoErro ? (
                      <img src={logoUrl} alt="Logo Observatório PNAE" className="w-full h-full object-contain" onError={() => setLogoErro(true)} />
                    ) : (
                      <svg viewBox="0 0 100 100" className="w-full h-full" aria-hidden="true">
                        <path d="M50 15C30 15 20 30 20 50C20 70 30 85 50 85C70 85 80 70 80 50C80 30 70 15 50 15ZM45 68L30 53L35 48L45 58L65 38L70 43L45 68Z" fill="#F6C044" />
                      </svg>
                    )}
                  </div>
                  <div>
                    <span className="block text-base sm:text-lg font-extrabold tracking-tight">
                      <span className="text-brand-yellow">OBSERVATÓRIO</span> PNAE
                    </span>
                    <span className="block text-[9px] uppercase tracking-widest text-brand-light">Baixo Sul da Bahia</span>
                  </div>
                </button>

                <nav className="hidden lg:flex items-center space-x-2 font-bold text-base" aria-label="Menu principal">
                  {navItems.map(v => (
                    <button
                      key={v}
                      onClick={() => irPara(v)}
                      aria-current={view === v ? 'page' : undefined}
                      className={`px-3.5 py-2 rounded-lg transition-all duration-300 transform hover:scale-105 hover:-translate-y-0.5 active:scale-95 ${view === v ? 'bg-brand-darkBrown text-brand-yellow shadow-md' : 'hover:bg-brand-darkBrown/60 text-white'}`}
                    >
                      {VIEW_LABELS[v]}
                    </button>
                  ))}
                </nav>

                <button onClick={() => setMobileMenuOpen(!mobileMenuOpen)} className="lg:hidden p-2 rounded-md hover:bg-brand-darkBrown focus:outline-none" aria-label="Abrir menu" aria-expanded={mobileMenuOpen}>
                  <svg className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    {mobileMenuOpen
                      ? <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                      : <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" />}
                  </svg>
                </button>
              </div>
            </div>

            {mobileMenuOpen && (
              <div className="lg:hidden bg-brand-brown border-t border-brand-darkBrown px-4 py-4 space-y-1.5">
                {navItems.map(v => (
                  <button key={v} onClick={() => irPara(v)} className={`block w-full text-left px-3 py-2.5 rounded-lg hover:bg-brand-darkBrown ${view === v ? 'text-brand-yellow font-bold' : 'text-white'}`}>
                    {VIEW_LABELS[v]}
                  </button>
                ))}
              </div>
            )}
          </header>

          <div className="flex-grow flex flex-col min-w-0">

            {/* Barra de acessibilidade */}
            <div className="bg-brand-charcoal text-white text-[11px] py-2 px-4 sm:px-6 lg:px-8 shadow-sm flex flex-wrap justify-between items-center gap-2 shrink-0">
              <div className="flex items-center gap-4">
                <span className="font-bold tracking-wider text-brand-light">Acessibilidade:</span>
                <button onClick={() => setHighContrast(!highContrast)} className="flex items-center gap-1 bg-neutral-700 py-1 px-2 rounded hover:bg-neutral-600">
                  <span className="inline-block w-3 h-3 bg-white border border-black rounded-full"></span>
                  {highContrast ? 'Desativar Alto Contraste' : 'Alto Contraste'}
                </button>
              </div>
              <div className="flex items-center gap-3">
                <button onClick={() => fontSize > 12 && setFontSize(fontSize - 2)} className="hover:bg-neutral-700 py-1 px-2.5 rounded font-bold" title="Diminuir fonte" aria-label="Diminuir fonte">A-</button>
                <button onClick={() => setFontSize(16)} className="hover:bg-neutral-700 py-1 px-2 rounded text-brand-light" title="Tamanho padrão">Padrão</button>
                <button onClick={() => fontSize < 22 && setFontSize(fontSize + 2)} className="hover:bg-neutral-700 py-1 px-2.5 rounded font-bold" title="Aumentar fonte" aria-label="Aumentar fonte">A+</button>
                <span className="text-neutral-500">|</span>
                <button
                  onClick={() => { const el = document.getElementById('conteudo-principal'); if (el) { el.focus(); el.scrollIntoView({ behavior: 'smooth' }); } }}
                  className="hover:underline text-brand-light"
                >
                  Ir para o conteúdo
                </button>
              </div>
            </div>

            {/* Trilha de navegação e status dos dados */}
            <div className="bg-brand-light/20 py-3.5 px-4 sm:px-6 lg:px-8 border-b border-brand-light shrink-0">
              <div className="max-w-7xl mx-auto text-xs flex flex-wrap justify-between items-center gap-2 text-brand-charcoal/80">
                <div className="flex items-center gap-1.5">
                  <button className="hover:underline text-brand-primary font-bold" onClick={() => irPara('home')}>Início</button>
                  {view !== 'home' && (<><span>/</span><span className="font-semibold">{VIEW_LABELS[view]}</span></>)}
                </div>
                <div className="flex items-center gap-2">
                  {statusEditais === 'carregando' ? (
                    <span className="text-brand-charcoal/50 font-medium flex items-center gap-1.5">
                      <span className="w-1.5 h-1.5 rounded-full bg-brand-yellow inline-block animate-pulse"></span>
                      Atualizando dados...
                    </span>
                  ) : statusEditais === 'ok' ? (
                    <span className="text-brand-charcoal/50 font-medium flex items-center gap-1.5" title="Dados sincronizados com a base oficial do CIAPRA">
                      <span className="w-1.5 h-1.5 rounded-full bg-brand-green inline-block"></span>
                      Dados atualizados
                    </span>
                  ) : (
                    <span className="text-brand-charcoal/40 font-medium">Base de dados temporariamente indisponível</span>
                  )}
                </div>
              </div>
            </div>

            {/* Busca global */}
            <div className="bg-brand-light/40 py-3 px-4 sm:px-6 lg:px-8 shrink-0">
              <div className="max-w-xl relative mx-auto lg:mx-0">
                <label htmlFor="busca-global" className="sr-only">Pesquisar no Observatório</label>
                <input
                  id="busca-global"
                  type="search"
                  placeholder="Pesquisar municípios, editais ou notícias..."
                  value={globalSearch}
                  onChange={(e) => setGlobalSearch(e.target.value)}
                  className="w-full pl-10 pr-16 py-2 rounded-full border border-brand-light focus:outline-none focus:ring-2 focus:ring-brand-primary bg-white text-brand-charcoal"
                />
                <span className="absolute left-3.5 top-2.5 text-brand-charcoal/50">
                  <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clipRule="evenodd" /></svg>
                </span>
                {globalSearch && (
                  <button onClick={() => setGlobalSearch('')} className="absolute right-3.5 top-2.5 text-brand-charcoal/70 hover:text-brand-charcoal font-bold text-sm">Limpar</button>
                )}
              </div>
            </div>

            <main id="conteudo-principal" tabIndex="-1" className="flex-grow outline-none">

              {/* ============ RESULTADOS DA BUSCA ============ */}
              {globalSearch.trim() && (
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 animate-fade-in">
                  <h2 className="text-2xl font-bold mb-4 text-brand-brown">Resultados para "{globalSearch}"</h2>
                  {totalResultados === 0 ? (
                    <p className="text-sm text-brand-charcoal/60">Nada encontrado. Tente outro termo.</p>
                  ) : (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {resultadosBusca.municipios.map(m => (
                        <div key={m.id} className={`${cardBg} p-4 rounded-lg`}>
                          <span className="text-xs font-bold text-brand-yellow">MUNICÍPIO</span>
                          <h3 className="text-lg font-bold text-brand-brown">{m.nome}</h3>
                          <p className="text-sm text-brand-charcoal/80">Nutricionista: {m.nutricionista}</p>
                          <button onClick={() => { irPara('municipios'); setSelectedMunicipio(m); }} className="text-brand-primary text-sm font-bold mt-2 hover:underline">Ver município →</button>
                        </div>
                      ))}
                      {resultadosBusca.editais.map(ed => (
                        <div key={ed.id} className={`${cardBg} p-4 rounded-lg`}>
                          <span className="text-xs font-bold text-brand-green">EDITAL / CHAMADA PÚBLICA</span>
                          <h3 className="text-base font-bold text-brand-brown">{ed.numero} — {ed.municipio}</h3>
                          <p className="text-sm text-brand-charcoal/80">Fechamento: {ed.data} · {ed.situacao}</p>
                          <button onClick={() => { irPara('editais'); setRelatorioMunicipio(ed.municipio); }} className="text-brand-primary text-sm font-bold mt-2 hover:underline">Ver editais do município →</button>
                        </div>
                      ))}
                      {resultadosBusca.noticias.map(n => (

                                    <span className="text-[10px] font-black uppercase bg-white/90 text-brand-brown px-3 py-1 rounded-full tracking-wider">📍 {item.municipio}</span>
                                  </div>
                                  <h2 className="text-xl sm:text-3xl font-extrabold text-white leading-tight max-w-3xl">{item.titulo}</h2>
                                  <p className="text-white/80 text-sm mt-2 max-w-2xl line-clamp-2">{item.resumo}</p>
                                  <div className="flex items-center gap-4 mt-5">
                                    <button onClick={() => setSelectedNoticia(item)} className="bg-brand-yellow hover:bg-white text-brand-brown font-black text-xs px-5 py-2.5 rounded-full shadow-lg transition-all">Ler notícia completa</button>
                                    <span className="text-white/60 text-xs font-semibold">{isoParaBR(item.data)}</span>
                                  </div>
                                </div>
                              </div>
                            ))}
                            {ultimasTres.length > 1 && (
                              <div className="absolute bottom-4 right-6 z-20 flex gap-2">
                                {ultimasTres.map((_, idx) => (
                                  <button key={idx} onClick={() => setFeaturedSlideIndex(idx)} className={`h-2 rounded-full transition-all ${idx === featuredSlideIndex ? 'bg-brand-yellow w-6' : 'bg-white/50 hover:bg-white/80 w-2'}`} aria-label={`Ir para destaque ${idx + 1}`} />
                                ))}
                              </div>
                            )}
                          </div>
                        </section>
                      )}

                      <section className="bg-white p-6 rounded-2xl border border-brand-light shadow-sm space-y-4">
                        <h2 className="text-xs font-black text-brand-charcoal/60 uppercase tracking-wider">Buscar Notícias</h2>
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                          <div>
                            <label htmlFor="news-busca" className="block text-[10px] font-bold text-brand-charcoal/60 uppercase mb-1">Palavra-chave</label>
                            <input id="news-busca" type="text" value={newsSearch} onChange={(e) => setNewsSearch(e.target.value)} placeholder="Ex: horta, cooperativa..." className="w-full border border-brand-light rounded-lg p-2.5 bg-brand-cream text-brand-charcoal text-sm focus:outline-none focus:ring-2 focus:ring-brand-primary" />
                          </div>
                          <div>
                            <label htmlFor="news-muni" className="block text-[10px] font-bold text-brand-charcoal/60 uppercase mb-1">Município</label>
                            <select id="news-muni" value={newsMunicipio} onChange={(e) => setNewsMunicipio(e.target.value)} className="w-full border border-brand-light rounded-lg p-2.5 bg-brand-cream text-brand-charcoal text-sm focus:outline-none focus:ring-2 focus:ring-brand-primary">
                              <option value="">Todos</option>
                              {municipiosNoticias.map(m => <option key={m} value={m}>{m}</option>)}
                            </select>
                          </div>
                          <div>
                            <label htmlFor="news-cat" className="block text-[10px] font-bold text-brand-charcoal/60 uppercase mb-1">Assunto</label>
                            <select id="news-cat" value={newsCategoria} onChange={(e) => setNewsCategoria(e.target.value)} className="w-full border border-brand-light rounded-lg p-2.5 bg-brand-cream text-brand-charcoal text-sm focus:outline-none focus:ring-2 focus:ring-brand-primary">
                              <option value="">Todos</option>
                              {categoriasNoticias.map(c => <option key={c} value={c}>{c}</option>)}
                            </select>
                          </div>
                          <div className="grid grid-cols-2 gap-2">
                            <div>
                              <label htmlFor="news-de" className="block text-[10px] font-bold text-brand-charcoal/60 uppercase mb-1">De</label>
                              <input id="news-de" type="date" value={newsDataDe} onChange={(e) => setNewsDataDe(e.target.value)} className="w-full border border-brand-light rounded-lg p-2 bg-brand-cream text-brand-charcoal text-xs focus:outline-none focus:ring-2 focus:ring-brand-primary" />
                            </div>
                            <div>
                              <label htmlFor="news-ate" className="block text-[10px] font-bold text-brand-charcoal/60 uppercase mb-1">Até</label>
                              <input id="news-ate" type="date" value={newsDataAte} onChange={(e) => setNewsDataAte(e.target.value)} className="w-full border border-brand-light rounded-lg p-2 bg-brand-cream text-brand-charcoal text-xs focus:outline-none focus:ring-2 focus:ring-brand-primary" />
                            </div>
                          </div>
                        </div>
                        {(newsSearch || newsMunicipio || newsCategoria || newsDataDe || newsDataAte) && (
                          <div className="flex justify-between items-center pt-2 border-t border-brand-light/60">
                            <span className="text-xs text-brand-charcoal/60 font-semibold">{noticiasFiltradas.length} notícia(s) encontrada(s)</span>
                            <button onClick={() => { setNewsSearch(''); setNewsMunicipio(''); setNewsCategoria(''); setNewsDataDe(''); setNewsDataAte(''); }} className="text-xs font-bold text-brand-primary hover:underline">Limpar filtros</button>
                          </div>
                        )}
                      </section>

                      <section>
                        <div className="flex items-center gap-3 mb-6">
                          <div className="w-1.5 h-6 bg-brand-green rounded-full"></div>
                          <h2 className="text-2xl font-black text-brand-brown tracking-tight">Todas as Notícias</h2>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                          {noticiasFiltradas.map(item => <CardNoticia key={item.id} item={item} onOpen={abrirNoticia} />)}
                          {noticiasFiltradas.length === 0 && (
                            <EstadoVazio
                              status={statusNoticias}
                              vazio={noticias.length === 0 ? 'Nenhuma notícia publicada ainda.' : 'Nenhuma notícia encontrada com os filtros selecionados.'}
                              erro="Não foi possível carregar as notícias agora. Tente novamente mais tarde."
                            />
                          )}
                        </div>
                      </section>
                    </div>
                  )}
                </div>
              )}

              {/* ============ SOBRE A REDE ============ */}
              {!globalSearch.trim() && view === 'sobre' && (
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 space-y-16 animate-fade-in">
                  <div className="space-y-14">
                    {/* Abertura */}
                    <header className="relative overflow-hidden rounded-3xl bg-brand-brown text-white px-6 py-10 sm:px-12 sm:py-14 shadow-lg">
                      <span className="absolute -right-16 -top-16 w-64 h-64 rounded-full bg-brand-yellow/10" aria-hidden="true"></span>
                      <span className="absolute -right-4 bottom-[-5rem] w-48 h-48 rounded-full bg-brand-green/20" aria-hidden="true"></span>
                      <div className="relative max-w-3xl space-y-5">
                        <span className="inline-block text-[11px] font-black uppercase tracking-[0.2em] text-brand-yellow">Sobre a Rede</span>
                        <h1 className="text-3xl sm:text-4xl font-black leading-tight">Rede PNAE Baixo Sul</h1>
                        <p className="text-base sm:text-lg leading-relaxed text-white/90">
                          A Rede PNAE Baixo Sul é uma iniciativa do <strong className="text-brand-yellow">CIAPRA</strong> criada para fortalecer a execução do Programa Nacional de Alimentação Escolar (PNAE) nos <strong className="text-brand-yellow">16 municípios</strong> do território do Baixo Sul da Bahia.
                        </p>
                      </div>
                    </header>

                    {/* Integração */}
                    <section className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                      <div className="lg:col-span-5">
                        <div className="w-12 h-1 bg-brand-green mb-4 rounded-full"></div>
                        <h2 className="text-2xl font-black text-brand-brown tracking-tight">Quem a Rede integra</h2>
                        <div className="flex flex-wrap gap-2 mt-5">
                          {['Gestores públicos', 'Nutricionistas', 'Agricultores familiares', 'Cooperativas', 'Instituições parceiras'].map(t => (
                            <span key={t} className="text-xs font-bold text-brand-darkGreen bg-brand-green/10 border border-brand-green/20 px-3 py-1.5 rounded-full">{t}</span>
                          ))}
                        </div>
                      </div>
                      <p className="lg:col-span-7 text-brand-charcoal text-base leading-relaxed">
                        O projeto promove a integração entre gestores públicos, nutricionistas, agricultores familiares, cooperativas e instituições parceiras, fortalecendo a agricultura familiar, qualificando a gestão pública e ampliando o acesso dos produtores locais às compras institucionais.
                      </p>
                    </section>

                    {/* Como atua */}
                    <section className="space-y-6">
                      <div>
                        <div className="w-12 h-1 bg-brand-yellow mb-4 rounded-full"></div>
                        <h2 className="text-2xl font-black text-brand-brown tracking-tight">Como a Rede atua</h2>
                      </div>
                      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                        {[
                          ['🎓', 'Capacitação'],
                          ['🤝', 'Articulação territorial'],
                          ['🛠️', 'Apoio técnico'],
                          ['📊', 'Monitoramento']
                        ].map(([icone, titulo]) => (
                          <div key={titulo} className="bg-white border border-brand-light rounded-2xl p-5 shadow-sm flex flex-col items-start gap-3">
                            <span className="w-11 h-11 rounded-xl bg-brand-yellow/20 flex items-center justify-center text-xl" aria-hidden="true">{icone}</span>
                            <h3 className="font-extrabold text-brand-brown text-sm sm:text-base leading-tight">{titulo}</h3>
                          </div>
                        ))}
                      </div>
                      <p className="text-brand-charcoal text-base leading-relaxed max-w-4xl">
                        Por meio de ações de capacitação, articulação territorial, apoio técnico e monitoramento, a Rede busca tornar o PNAE um instrumento estratégico para o desenvolvimento regional, garantindo uma alimentação escolar de qualidade, valorizando a produção local e gerando oportunidades para quem vive e produz no campo.
                      </p>
                    </section>

                    {/* Fechamento */}
                    <section className="rounded-3xl bg-brand-green/10 border border-brand-green/25 px-6 py-8 sm:px-12 sm:py-10">
                      <blockquote className="border-l-4 border-brand-green pl-5 sm:pl-6">
                        <p className="text-lg sm:text-xl font-semibold text-brand-brown leading-relaxed">
                          Mais do que uma rede de cooperação, a iniciativa representa um modelo de gestão compartilhada que une inovação, transparência e desenvolvimento sustentável em benefício de todo o território do Baixo Sul.
                        </p>
                      </blockquote>
                      <div className="flex flex-wrap gap-2 mt-6 pl-6 sm:pl-7">
                        {['Inovação', 'Transparência', 'Desenvolvimento sustentável'].map(t => (
                          <span key={t} className="text-xs font-black uppercase tracking-wide text-brand-darkGreen bg-white border border-brand-green/30 px-3 py-1.5 rounded-full">{t}</span>
                        ))}
                      </div>
                    </section>

                    {/* Atuação do CIAPRA */}
                    <div className="bg-white border border-brand-light rounded-2xl p-6 shadow-sm flex gap-4 items-start">
                      <span className="w-11 h-11 rounded-xl bg-brand-brown/10 flex items-center justify-center text-xl shrink-0" aria-hidden="true">🏛️</span>
                      <div>
                        <h2 className="text-base font-extrabold text-brand-brown mb-1">Atuação do CIAPRA</h2>
                        <p className="text-sm text-brand-charcoal/80 leading-relaxed">
                          O Consórcio Intermunicipal do Mosaico das APAs do Baixo Sul (CIAPRA) faz a gestão da integração territorial, apoia as cooperativas e associações na regularização documental e assessora as prefeituras nas chamadas públicas do PNAE.
                        </p>
                      </div>
                    </div>
                  </div>

                  <section className="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-12 bg-white p-6 sm:p-8 md:p-12 rounded-3xl border border-brand-light shadow-sm">
                    <div className="lg:col-span-5 space-y-6">
                      <div>
                        <div className="w-12 h-1 bg-brand-yellow mb-4 rounded-full"></div>
                        <h2 className="text-2xl font-black text-brand-brown tracking-tight">Fale Conosco</h2>
                        <p className="text-brand-charcoal/80 text-sm mt-2">Dúvidas sobre editais, cadastro da sua associação de produtores ou sugestões? Entre em contato com a equipe do CIAPRA.</p>
                      </div>
                      <div className="space-y-3">
                        <div className="flex items-start gap-4 p-4 rounded-2xl bg-brand-cream border border-brand-light">
                          <span className="w-10 h-10 rounded-xl bg-brand-green/10 flex items-center justify-center text-lg shrink-0" aria-hidden="true">📍</span>
                          <div className="text-sm text-brand-charcoal">
                            <span className="block text-[11px] font-bold uppercase tracking-wide text-brand-charcoal/60">Endereço</span>
                            <span className="block font-bold text-brand-brown">Sede do CIAPRA Baixo Sul</span>
                            <span className="block">{CONFIG.ENDERECO}</span>
                          </div>
                        </div>
                        <a href={`tel:+55${CONFIG.TELEFONE_CONTATO.replace(/\D/g, '')}`} className="flex items-start gap-4 p-4 rounded-2xl bg-brand-cream border border-brand-light hover:border-brand-green transition-colors">
                          <span className="w-10 h-10 rounded-xl bg-brand-green/10 flex items-center justify-center text-lg shrink-0" aria-hidden="true">📞</span>
                          <div className="text-sm text-brand-charcoal">
                            <span className="block text-[11px] font-bold uppercase tracking-wide text-brand-charcoal/60">Telefone</span>
                            <span className="block font-bold text-brand-brown">{CONFIG.TELEFONE_CONTATO}</span>
                          </div>
                        </a>
                        <a href={`mailto:${CONFIG.EMAIL_CONTATO}`} className="flex items-start gap-4 p-4 rounded-2xl bg-brand-cream border border-brand-light hover:border-brand-green transition-colors">
                          <span className="w-10 h-10 rounded-xl bg-brand-green/10 flex items-center justify-center text-lg shrink-0" aria-hidden="true">✉️</span>
                          <div className="text-sm text-brand-charcoal min-w-0">
                            <span className="block text-[11px] font-bold uppercase tracking-wide text-brand-charcoal/60">E-mail</span>
                            <span className="block font-bold text-brand-brown break-all">{CONFIG.EMAIL_CONTATO}</span>
                          </div>
                        </a>
                      </div>
                    </div>

                    <div className="lg:col-span-7 flex flex-col gap-3">
                      <div className="rounded-2xl overflow-hidden border border-brand-light shadow-sm flex-grow min-h-[300px]">
                        <iframe src={`https://www.google.com/maps?q=${CONFIG.MAPS_COORD}&z=17&output=embed`} title="Localização da sede do CIAPRA em Ituberá" className="w-full h-full border-0" style={{ minHeight: '300px' }} loading="lazy" referrerPolicy="no-referrer-when-downgrade"></iframe>
                      </div>
                      <a href={`https://www.google.com/maps?q=${CONFIG.MAPS_COORD}`} target="_blank" rel="noopener noreferrer" className="self-start text-xs font-bold text-brand-primary hover:underline">📍 Abrir no Google Maps →</a>
                    </div>
                  </section>
                </div>
              )}
            </main>

            {/* Parceiros */}
            <section className="bg-brand-light/20 border-t border-brand-light py-14 px-4">
              <div className="max-w-5xl mx-auto text-center space-y-8">
                <div>
                  <h2 className="text-xl font-bold text-brand-brown">Parceiros Institucionais</h2>
                  <p className="text-brand-charcoal/70 text-xs mt-1">Instituições que tornam o Observatório uma realidade.</p>
                </div>
                <div className="flex flex-wrap justify-center items-stretch gap-5 sm:gap-6">
                  {[
                    ['https://i.postimg.cc/VNqSB7m6/logo-CAR.png', 'CAR'],
                    ['https://i.postimg.cc/N06y7NB5/logo-instituo-arapyau.png', 'Instituto Arapyaú'],
                    ['https://i.postimg.cc/SK6X7Zkx/logo-PARQUE-CIENTIFICO.png', 'Parque Científico']
                  ].map(([src, nome]) => (
                    <div key={nome} className="bg-white border border-brand-light rounded-2xl shadow-sm hover:shadow-md transition-all p-6 w-44 sm:w-52 h-28 sm:h-32 flex items-center justify-center">
                      <img src={src} alt={`Logo ${nome}`} className="max-h-full max-w-full object-contain" loading="lazy" onError={(e) => { e.target.style.display = 'none'; }} />
                    </div>
                  ))}
                </div>
              </div>
            </section>

            <footer className={`${footerBg} py-8 border-t text-center text-xs mt-auto shrink-0`}>
              <p>© {new Date().getFullYear()} Observatório PNAE Baixo Sul da Bahia — CIAPRA. Todos os direitos reservados.</p>
            </footer>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
